chtfleisch in Wasser mit Zitronensaft legen (bleibt hell), dann gut ausdrücken und fein hacken."}, {"t": "Béchamel", "d": "10 Min.", "sec": 600, "wait": false, "b": "Butter schmelzen, Mehl 1 Min. anschwitzen. Warme Milch nach und nach einrühren, bis eine glatte, dicke Soße entsteht. Auberginen einrühren, 3 Min. köcheln. Käse, Muskat und Salz unterrühren."}, {"t": "Anrichten", "d": "2 Min.", "sec": 120, "wait": false, "b": "Auberginen-Creme als Bett auf die Teller streichen, Lamm mit Soße in die Mitte geben, Petersilie darüber."}], "notes": ["Der Name heißt „Der Sultan war begeistert“. Klassiker aus der osmanischen Palastküche.", "Über offener Flamme geröstet schmecken die Auberginen rauchig. Das macht das Gericht aus.", "Statt Lamm geht Kalb oder Rind (Rind ca. 30 Min. länger).", "Das Lamm lässt sich am Vortag schmoren. Die Creme frisch machen, sie dickt beim Stehen nach."]}, {"id": "pad-kra-pao", "name": "Pad Kra Pao (Thai-Basilikum-Hack mit Spiegelei)", "cat": "Asiatisch", "yield": "2 Portionen", "base": 2, "hydration": null, "scalable": true, "ing": [{"n": "Jasminreis", "a": 150.0, "u": "g", "p": "jasminreis"}, {"n": "Wasser (für den Reis)", "a": 200.0, "u": "g", "p": "wasser"}, {"n": "Schweinehack (oder gehackte Hähnchenschenkel)", "a": 300.0, "u": "g", "p": "hackfleisch"}, {"n": "Knoblauch", "a": 15.0, "u": "g", "p": "knoblauch"}, {"n": "Thai-Chilis (Bird's Eye), nach Schärfe", "a": 4.0, "u": "Stk.", "p": "chili"}, {"n": "Neutrales Öl (zum Braten)", "a": 15.0, "u": "g", "p": "oel"}, {"n": "Austernsauce", "a": 15.0, "u": "g", "p": "austernsauce"}, {"n": "Helle Sojasauce", "a": 10.0, "u": "g", "p": "sojasauce"}, {"n": "Dunkle Sojasauce", "a": 5.0, "u": "g", "p": "sojasauce"}, {"n": "Fischsauce", "a": 8.0, "u": "g", "p": "fischsauce"}, {"n": "Zucker", "a": 5.0, "u": "g", "p": "zucker"}, {"n": "Wasser (für die Soße)", "a": 30.0, "u": "g", "p": "wasser"}, {"n": "Thai-Basilikum (Holy Basil / Bai Kra Pao)", "a": 30.0, "u": "g", "p": "thai_basilikum"}, {"n": "Eier (Größe L)", "a": 2.0, "u": "Stk.", "p": "eier"}, {"n": "Neutrales Öl (für die Spiegeleier)", "a": 40.0, "u": "g", "p": "oel"}], "steps": [{"t": "Reis waschen", "d": "3 Min.", "sec": 180, "wait": false, "b": "Reis in kaltem Wasser 3-mal waschen, bis das Wasser fast klar ist. Mit 200 g Wasser in einen Topf mit Deckel geben."}, {"t": "Reis kochen", "d": "Warten 12 Min.", "sec": 720, "wait": true, "b": "Mit Deckel aufkochen, auf kleinste Stufe schalten, 12 Min. garen. Deckel zu lassen."}, {"t": "Nachquellen und vorbereiten", "d": "Warten 10 Min.", "sec": 600, "wait": true, "b": "Herd aus, Reis mit Deckel nachquellen lassen. In der Zeit: Knoblauch und Chilis im Mörser grob zerstoßen (oder fein hacken). Austernsauce, beide Sojasaucen, Fischsauce, Zucker und Wasser verrühren. Basilikumblätter abzupfen."}, {"t": "Spiegeleier", "d": "4 Min.", "sec": 240, "wait": false, "b": "Öl in der Pfanne (oder im Wok) stark erhitzen. Eier einzeln hineingleiten lassen und mit heißem Öl begießen, bis der Rand knusprig braun ist und das Eigelb noch flüssig. Herausnehmen, Öl bis auf ca. 15 g abgießen."}, {"t": "Anbraten", "d": "4 Min.", "sec": 240, "wait": false, "b": "Knoblauch-Chili-Paste im heißen Öl 20–30 Sek. anbraten, bis sie duftet, nicht bräunen. Hack zugeben, zerteilen und bei hoher Hitze krümelig und durch braten."}, {"t": "Würzen", "d": "2 Min.", "sec": 120, "wait": false, "b": "Soßenmischung zugeben und unter Rühren einkochen, bis das Fleisch glänzt und kaum noch Flüssigkeit da ist."}, {"t": "Basilikum", "d": "1 Min.", "sec": 60, "wait": false, "b": "Herd aus. Basilikum unterheben, nur bis es zusammenfällt."}, {"t": "Anrichten", "d": "2 Min.", "sec": 120, "wait": false, "b": "Reis auf die Teller, Pad Kra Pao daneben, Spiegelei obendrauf. Dazu Prik Nam Pla: Fischsauce mit gehackten Chilis und etwas Limette."}], "notes": ["Original ist Holy Basil (Bai Kra Pao, pfeffrig-nelkig), im Asia-Markt oft tiefgekühlt. Ersatz: Thai-Basilikum (Horapha). Italienisches Basilikum nur im Notfall, schmeckt deutlich anders.", "Schärfe: 4 Chilis sind deutlich scharf, Thai-Standard sind 6–10. Für mild 1–2 Chilis ohne Kerne.", "Hohe Hitze ist entscheidend: Hack nicht in zu kleiner Pfanne braten, sonst kocht es im eigenen Saft. Bei 4 Portionen in zwei Durchgängen.", "Ohne dunkle Sojasauce wird es heller, schmeckt aber fast gleich."]}, {"id": "gebratener-reis-mit-ei", "name": "Gebratener Reis mit Ei (Egg Fried Rice)", "cat": "Asiatisch", "yield": "2 Portionen", "base": 2, "hydration": null, "scalable": true, "ing": [{"n": "Gekochter Jasminreis vom Vortag (aus ca. 200 g roh)", "a": 500.0, "u": "g", "p": "jasminreis"}, {"n": "Eier (Größe L)", "a": 3.0, "u": "Stk.", "p": "eier"}, {"n": "Karotte", "a": 60.0, "u": "g", "p": "karotten"}, {"n": "Erbsen (TK)", "a": 80.0, "u": "g", "p": "erbsen"}, {"n": "Frühlingszwiebeln", "a": 40.0, "u": "g", "p": "fruehlingszwiebel"}, {"n": "Knoblauch", "a": 6.0, "u": "g", "p": "knoblauch"}, {"n": "Neutrales Öl", "a": 30.0, "u": "g", "p": "oel"}, {"n": "Helle Sojasauce", "a": 20.0, "u": "g", "p": "sojasauce"}, {"n": "Dunkle Sojasauce", "a": 5.0, "u": "g", "p": "sojasauce"}, {"n": "Salz", "a": 2.0, "u": "g", "p": "salz"}, {"n": "Weißer Pfeffer", "a": 0.5, "u": "g", "p": "pfeffer"}, {"n": "Sesamöl", "a": 5.0, "u": "g", "p": "sesamoel"}], "steps": [{"t": "Vorbereiten", "d": "5 Min.", "sec": 300, "wait": false, "b": "Kalten Reis mit den Händen zerkrümeln, bis keine Klumpen mehr da sind. Karotte fein würfeln, Knoblauch hacken. Frühlingszwiebeln in Ringe, Weißes und Grünes getrennt. Eier mit einer Prise Salz verquirlen."}, {"t": "Ei", "d": "2 Min.", "sec": 120, "wait": false, "b": "Wok oder große Pfanne stark erhitzen, 10 g Öl hinein. Eier zugeben, kurz stocken lassen und grob rühren, noch leicht glänzend herausnehmen."}, {"t": "Gemüse", "d": "2 Min.", "sec": 120, "wait": false, "b": "Restliches Öl in den Wok, Knoblauch, Frühlingszwiebel-Weißes und Karotte 1 Min. braten. Erbsen zugeben."}, {"t": "Reis braten", "d": "5 Min.", "sec": 300, "wait": false, "b": "Reis zugeben, bei voller Hitze immer wieder flach drücken und wenden, bis er heiß ist und die Körner springen."}, {"t": "Würzen", "d": "2 Min.", "sec": 120, "wait": false, "b": "Beide Sojasaucen am Rand in den Wok gießen, damit sie kurz karamellisieren, dann untermischen. Mit Salz und weißem Pfeffer abschmecken."}, {"t": "Fertigstellen", "d": "1 Min.", "sec": 60, "wait": false, "b": "Ei, Frühlingszwiebel-Grün und Sesamöl unterheben. Sofort servieren."}], "notes": ["Der wichtigste Punkt: kalter, trockener Reis vom Vortag. Frisch gekochten Reis auf einem Blech ausbreiten und mindestens 1 h offen in den Kühlschrank stellen.", "Pfanne nicht überladen. Für 4 Portionen in zwei Durchgängen braten.", "Erweitern: Garnelen, Hähnchen oder Char Siu zum Gemüse geben."]}, {"id": "chicken-teriyaki", "name": "Chicken Teriyaki", "cat": "Asiatisch", "yield": "2 Portionen", "base": 2, "hydration": null, "scalable": true, "ing": [{"n": "Hähnchenschenkel mit Haut, ohne Knochen", "a": 500.0, "u": "g", "p": "haehnchen"}, {"n": "Salz", "a": 2.0, "u": "g", "p": "salz"}, {"n": "Neutrales Öl", "a": 5.0, "u": "g", "p": "oel"}, {"n": "Sojasauce (japanisch)", "a": 30.0, "u": "g", "p": "sojasauce"}, {"n": "Mirin", "a": 30.0, "u": "g", "p": "mirin"}, {"n": "Sake (oder Wasser)", "a": 30.0, "u": "g", "p": "sake"}, {"n": "Zucker", "a": 10.0, "u": "g", "p": "zucker"}, {"n": "Sesam, geröstet (optional)", "a": 3.0, "u": "g", "p": "sesam"}, {"n": "Frühlingszwiebel (optional)", "a": 15.0, "u": "g", "p": "fruehlingszwiebel"}], "steps": [{"t": "Soße mischen", "d": "2 Min.", "sec": 120, "wait": false, "b": "Sojasauce, Mirin, Sake und Zucker verrühren, bis sich der Zucker gelöst hat."}, {"t": "Hähnchen vorbereiten", "d": "3 Min.", "sec": 180, "wait": false, "b": "Fleisch trocken tupfen. Dicke Stellen auf der Fleischseite flach einschneiden, damit alles gleich schnell gart. Leicht salzen."}, {"t": "Hautseite braten", "d": "Warten 7 Min.", "sec": 420, "wait": true, "b": "Öl in die Pfanne, Hähnchen mit der Haut nach unten bei mittlerer Hitze braten, bis die Haut goldbraun und knusprig ist. Ab und zu mit einem Pfannenwender flach drücken."}, {"t": "Wenden", "d": "4 Min.", "sec": 240, "wait": false, "b": "Wenden und weitere 3–4 Min. braten, bis das Fleisch durch ist."}, {"t": "Fett abtupfen", "d": "1 Min.", "sec": 60, "wait": false, "b": "Ausgetretenes Fett mit Küchenpapier aus der Pfanne tupfen. Sonst hält die Glasur nicht."}, {"t": "Glasieren", "d": "3 Min.", "sec": 180, "wait": false, "b": "Soße angießen und bei mittlerer bis hoher Hitze einkochen. Fleisch dabei immer wieder wenden und begießen, bis die Soße sirupartig glänzt."}, {"t": "Schneiden", "d": "2 Min.", "sec": 120, "wait": false, "b": "In Streifen schneiden, restliche Glasur darüber. Mit Sesam und Frühlingszwiebel bestreuen. Dazu Reis (siehe Onigiri Grundrezept) und Brokkoli."}], "notes": ["Japanische Art: nur Soja, Mirin, Sake und Zucker, ohne Stärke und Knoblauch. Die Glasur entsteht durch Einkochen.", "Schenkel bleiben saftiger als Brust. Mit Brust: Garzeit kürzen.", "Ohne Sake: Wasser nehmen, der Geschmack wird etwas flacher."]}, {"id": "rotes-thai-curry-mit-haehnchen", "name": "Rotes Thai-Curry mit Hähnchen (Gaeng Daeng)", "cat": "Asiatisch", "yield": "4 Portionen", "base": 4, "hydration": null, "scalable": true, "ing": [{"n": "Hähnchenschenkel ohne Haut und Knochen", "a": 600.0, "u": "g", "p": "haehnchen"}, {"n": "Rote Currypaste (z. B. Maesri)", "a": 60.0, "u": "g", "p": "currypaste"}, {"n": "Kokosmilch (2 Dosen)", "a": 800.0, "u": "g", "p": "kokosmilch"}, {"n": "Neutrales Öl", "a": 15.0, "u": "g", "p": "oel"}, {"n": "Fischsauce", "a": 20.0, "u": "g", "p": "fischsauce"}, {"n": "Palmzucker (oder brauner Zucker)", "a": 10.0, "u": "g", "p": "zucker"}, {"n": "Kaffirlimettenblätter", "a": 4.0, "u": "Stk.", "p": "gewuerz"}, {"n": "Rote Paprika", "a": 150.0, "u": "g", "p": "paprika"}, {"n": "Bambussprossen (Dose, abgetropft)", "a": 150.0, "u": "g", "p": "bambus"}, {"n": "Thai-Basilikum", "a": 15.0, "u": "g", "p": "thai_basilikum"}, {"n": "Limette", "a": 1.0, "u": "Stk.", "p": "limette"}], "steps": [{"t": "Vorbereiten", "d": "10 Min.", "sec": 600, "wait": false, "b": "Hähnchen in mundgerechte, dünne Stücke schneiden. Paprika in Streifen. Kaffirblätter von der Mittelrippe zupfen. Dosen nicht schütteln: Die dicke Creme oben abschöpfen und beiseitestellen."}, {"t": "Paste anrösten", "d": "3 Min.", "sec": 180, "wait": false, "b": "Öl und ca. 100 g der dicken Kokoscreme im Topf erhitzen. Currypaste zugeben und unter Rühren braten, bis es stark duftet und sich das Öl absetzt."}, {"t": "Hähnchen", "d": "3 Min.", "sec": 180, "wait": false, "b": "Hähnchen zugeben und rundum in der Paste wenden, bis es außen nicht mehr roh ist."}, {"t": "Köcheln", "d": "Warten 12 Min.", "sec": 720, "wait": true, "b": "Restliche Kokosmilch, Fischsauce, Zucker und Kaffirblätter zugeben. Leise köcheln, nicht sprudelnd kochen."}, {"t": "Gemüse", "d": "4 Min.", "sec": 240, "wait": false, "b": "Paprika und Bambussprossen zugeben und 3–4 Min. mitgaren, sie sollen noch Biss haben."}, {"t": "Abschmecken", "d": "2 Min.", "sec": 120, "wait": false, "b": "Herd aus, Basilikum unterziehen. Mit Fischsauce (salzig), Zucker (süß) und Limettensaft (sauer) ausbalancieren. Dazu Jasminreis."}], "notes": ["Schärfe steuert die Paste: Maesri ist deutlich scharf, Mae Ploy sehr scharf. Beim ersten Mal mit 40 g starten.", "Paste immer erst in Fett anrösten. Direkt in die Kokosmilch gerührt schmeckt sie flach.", "Ohne Kaffirblätter: etwas Limettenschale. Statt Hähnchen gehen Garnelen (nur 3 Min. ziehen lassen) oder Tofu."]}, {"id": "pad-thai-mit-haehnchen", "name": "Pad Thai mit Hähnchen", "cat": "Asiatisch", "yield": "2 Portionen", "base": 2, "hydration": null, "scalable": true, "ing": [{"n": "Reisbandnudeln (ca. 5 mm breit)", "a": 125.0, "u": "g", "p": "reisbandnudeln"}, {"n": "Tamarindenpaste (Puree, kein Konzentrat)", "a": 25.0, "u": "g", "p": "tamarinde"}, {"n": "Brauner Zucker (oder Palmzucker)", "a": 25.0, "u": "g", "p": "zucker"}, {"n": "Fischsauce", "a": 20.0, "u": "g", "p": "fischsauce"}, {"n": "Austernsauce", "a": 15.0, "u": "g", "p": "austernsauce"}, {"n": "Hähnchenbrust", "a": 150.0, "u": "g", "p": "haehnchen"}, {"n": "Tofu, fest", "a": 80.0, "u": "g", "p": "tofu"}, {"n": "Eier (Größe L)", "a": 2.0, "u": "Stk.", "p": "eier"}, {"n": "Knoblauch", "a": 6.0, "u": "g", "p": "knoblauch"}, {"n": "Schalotte", "a": 40.0, "u": "g", "p": "zwiebel"}, {"n": "Neutrales Öl", "a": 30.0, "u": "g", "p": "oel"}, {"n": "Sojasprossen", "a": 100.0, "u": "g", "p": "sojasprossen"}, {"n": "Frühlingszwiebeln (oder Schnittknoblauch)", "a": 30.0, "u": "g", "p": "fruehlingszwiebel"}, {"n": "Erdnüsse, geröstet", "a": 30.0, "u": "g", "p": "erdnuesse"}, {"n": "Chiliflocken", "a": 1.0, "u": "g", "p": "chiliflocken"}, {"n": "Limette", "a": 1.0, "u": "Stk.", "p": "limette"}], "steps": [{"t": "Nudeln einweichen", "d": "Warten 30 Min.", "sec": 1800, "wait": true, "b": "Nudeln in lauwarmem Wasser einweichen, bis sie biegsam, aber noch fest sind. Abgießen. Sie garen im Wok fertig."}, {"t": "Soße", "d": "2 Min.", "sec": 120, "wait": false, "b": "Tamarinde, Zucker, Fischsauce und Austernsauce verrühren, bis sich der Zucker gelöst hat. Probieren: süß, sauer und salzig sollen sich die Waage halten."}, {"t": "Schneiden", "d": "8 Min.", "sec": 480, "wait": false, "b": "Hähnchen in dünne Streifen, Tofu in kleine Würfel. Knoblauch und Schalotte hacken. Frühlingszwiebeln in 4 cm Stücke. Erdnüsse grob hacken. Alles griffbereit neben den Herd stellen."}, {"t": "Hähnchen", "d": "3 Min.", "sec": 180, "wait": false, "b": "Wok stark erhitzen, 15 g Öl. Hähnchen durchbraten, herausnehmen."}, {"t": "Nudeln und Soße", "d": "3 Min.", "sec": 180, "wait": false, "b": "Restliches Öl, Tofu, Knoblauch und Schalotte 1 Min. braten. Nudeln und Soße zugeben, ständig wenden, bis die Soße aufgesogen ist und die Nudeln weich sind."}, {"t": "Ei", "d": "2 Min.", "sec": 120, "wait": false, "b": "Nudeln zur Seite schieben, Eier in die freie Stelle schlagen, kurz stocken lassen, grob verrühren und untermischen. Hähnchen zurück in den Wok."}, {"t": "Sprossen", "d": "1 Min.", "sec": 60, "wait": false, "b": "Sprossen und Frühlingszwiebeln 30 Sek. unterheben, sie sollen knackig bleiben."}, {"t": "Anrichten", "d": "1 Min.", "sec": 60, "wait": false, "b": "Mit Erdnüssen, Chiliflocken und Limettenspalten servieren."}], "notes": ["Tamarinde ist der typische säuerliche Geschmack. Konzentrat ist deutlich stärker: davon nur die Hälfte nehmen.", "Nudeln eher zu kurz einweichen. Matschige Nudeln lassen sich nicht retten.", "Nicht mehr als 2 Portionen auf einmal im Wok, sonst kleben die Nudeln."]}, {"id": "bulgogi", "name": "Bulgogi (Koreanisches mariniertes Rindfleisch)", "cat": "Asiatisch", "yield": "4 Portionen", "base": 4, "hydration": null, "scalable": true, "ing": [{"n": "Rindfleisch (Hüfte, Entrecôte oder Roastbeef)", "a": 600.0, "u": "g", "p": "rind_kurz"}, {"n": "Sojasauce", "a": 60.0, "u": "g", "p": "sojasauce"}, {"n": "Zucker", "a": 25.0, "u": "g", "p": "zucker"}, {"n": "Honig", "a": 15.0, "u": "g", "p": "honig"}, {"n": "Birne (am besten Nashi)", "a": 100.0, "u": "g", "p": "birne"}, {"n": "Zwiebel", "a": 80.0, "u": "g", "p": "zwiebel"}, {"n": "Knoblauch", "a": 15.0, "u": "g", "p": "knoblauch"}, {"n": "Ingwer", "a": 5.0, "u": "g", "p": "ingwer"}, {"n": "Sesamöl", "a": 15.0, "u": "g", "p": "sesamoel"}, {"n": "Pfeffer", "a": 1.0, "u": "g", "p": "pfeffer"}, {"n": "Neutrales Öl", "a": 15.0, "u": "g", "p": "oel"}, {"n": "Frühlingszwiebeln", "a": 40.0, "u": "g", "p": "fruehlingszwiebel"}, {"n": "Sesam, geröstet", "a": 5.0, "u": "g", "p": "sesam"}], "steps": [{"t": "Anfrieren", "d": "Warten 30 Min.", "sec": 1800, "wait": true, "b": "Fleisch ins Gefrierfach legen. Angefroren lässt es sich hauchdünn schneiden."}, {"t": "Schneiden", "d": "10 Min.", "sec": 600, "wait": false, "b": "Quer zur Faser in 2–3 mm dünne Scheiben schneiden. Abkürzung: fertig geschnittenes Hot-Pot-Fleisch aus dem Asia-Markt."}, {"t": "Marinade", "d": "5 Min.", "sec": 300, "wait": false, "b": "Birne, Zwiebel, Knoblauch und Ingwer fein reiben oder pürieren. Mit Sojasauce, Zucker, Honig, Sesamöl und Pfeffer verrühren. Frühlingszwiebeln in Ringe schneiden, die Hälfte in die Marinade."}, {"t": "Marinieren", "d": "Warten 1 h", "sec": 3600, "wait": true, "b": "Fleisch mit der Marinade verkneten und abgedeckt in den Kühlschrank stellen. Mindestens 30 Min., gern über Nacht."}, {"t": "Braten", "d": "8 Min.", "sec": 480, "wait": false, "b": "Große Pfanne oder Grillpfanne sehr heiß werden lassen, etwas Öl. Fleisch portionsweise in einer Lage 2–3 Min. braten, bis es Röstspuren hat. Nicht zu viel auf einmal, sonst kocht es."}, {"t": "Anrichten", "d": "2 Min.", "sec": 120, "wait": false, "b": "Mit Sesam und restlicher Frühlingszwiebel bestreuen. Dazu Reis, Salatblätter zum Einwickeln und Kimchi."}], "notes": ["Die geriebene Birne macht das Fleisch zart und bringt Süße. Ersatz: Apfel oder etwas mehr Honig.", "Mariniertes Fleisch lässt sich roh einfrieren und später direkt braten.", "Klassisch als Ssam: Reis, Fleisch und etwas Ssamjang in ein Salatblatt wickeln."]}, {"id": "galbi-jjim", "name": "Galbi-jjim (Koreanisch geschmorte Rinderrippen)", "cat": "Asiatisch", "yield": "4 Portionen", "base": 4, "hydration": null, "scalable": true, "ing": [{"n": "Rinderrippe / Short Ribs mit Knochen, in ca. 5 cm Stücken", "a": 1500.0, "u": "g", "p": "rind_schmor"}, {"n": "Getrocknete Shiitake", "a": 20.0, "u": "g", "p": "shiitake"}, {"n": "Wasser (zum Einweichen der Pilze)", "a": 250.0, "u": "g", "p": "wasser"}, {"n": "Birne (am besten Nashi)", "a": 150.0, "u": "g", "p": "birne"}, {"n": "Zwiebel", "a": 100.0, "u": "g", "p": "zwiebel"}, {"n": "Knoblauch", "a": 25.0, "u": "g", "p": "knoblauch"}, {"n": "Ingwer", "a": 10.0, "u": "g", "p": "ingwer"}, {"n": "Sojasauce", "a": 90.0, "u": "g", "p": "sojasauce"}, {"n": "Brauner Zucker", "a": 30.0, "u": "g", "p": "zucker"}, {"n": "Honig", "a": 20.0, "u": "g", "p": "honig"}, {"n": "Mirin", "a": 30.0, "u": "g", "p": "mirin"}, {"n": "Pfeffer", "a": 1.0, "u": "g", "p": "pfeffer"}, {"n": "Wasser (zum Schmoren)", "a": 400.0, "u": "g", "p": "wasser"}, {"n": "Rettich (Daikon)", "a": 300.0, "u": "g", "p": "rettich"}, {"n": "Karotten", "a": 200.0, "u": "g", "p": "karotten"}, {"n": "Maronen, gegart (optional)", "a": 100.0, "u": "g", "p": "_skip"}, {"n": "Sesamöl", "a": 15.0, "u": "g", "p": "sesamoel"}, {"n": "Frühlingszwiebeln", "a": 30.0, "u": "g", "p": "fruehlingszwiebel"}, {"n": "Sesam, geröstet", "a": 3.0, "u": "g", "p": "sesam"}], "steps": [{"t": "Wässern", "d": "Warten 1 h", "sec": 3600, "wait": true, "b": "Rippen in kaltes Wasser legen, nach 30 Min. das Wasser wechseln. Das zieht Blut heraus, die Soße wird klarer. Parallel Shiitake in 250 g warmem Wasser einweichen."}, {"t": "Marinade", "d": "10 Min.", "sec": 600, "wait": false, "b": "Birne, Zwiebel, Knoblauch und Ingwer im Mixer fein pürieren. Mit Sojasauce, Zucker, Honig, Mirin und Pfeffer verrühren."}, {"t": "Blanchieren", "d": "Warten 8 Min.", "sec": 480, "wait": true, "b": "Rippen in kochendem Wasser 5–8 Min. sprudelnd kochen, abgießen und kalt abspülen. Grobes Fett außen abschneiden."}, {"t": "Schmoren", "d": "Warten 1 h", "sec": 3600, "wait": true, "b": "Rippen, Marinade, 400 g Wasser und das Shiitake-Einweichwasser in einen schweren Topf geben. Aufkochen, Deckel drauf, bei mittel-kleiner Hitze simmern. Zwischendurch einmal wenden."}, {"t": "Gemüse schneiden", "d": "10 Min.", "sec": 600, "wait": false, "b": "Rettich und Karotten in 4 cm große Stücke schneiden, die Kanten mit dem Schälmesser abrunden (zerfällt dann nicht). Shiitake-Stiele entfernen, Hüte halbieren."}, {"t": "Mit Gemüse schmoren", "d": "Warten 40 Min.", "sec": 2400, "wait": true, "b": "Gemüse, Shiitake und Maronen zugeben und mit Deckel weiter simmern, bis das Fleisch sehr weich ist und der Rettich glasig."}, {"t": "Glasieren", "d": "7 Min.", "sec": 420, "wait": false, "b": "Deckel ab, Hitze hoch. Soße immer wieder über Fleisch und Gemüse löffeln, bis sie sirupartig glänzt und fast eingekocht ist. Sesamöl unterheben."}, {"t": "Anrichten", "d": "2 Min.", "sec": 120, "wait": false, "b": "Auf eine Platte geben, mit Frühlingszwiebel und Sesam bestreuen. Dazu Reis und Kimchi."}], "notes": ["Koreanisch wird nicht angebraten. Wässern und Blanchieren sorgen für einen sauberen, klaren Geschmack.", "Fettarm: am Vortag kochen, abkühlen lassen und die feste Fettschicht abheben. Dann nur noch glasieren.", "Short Ribs heißen beim Metzger „Querrippe“. Im Asia-Markt gibt es sie fertig im Galbi-Schnitt.", "Schnellkochtopf: Schritt 4 und 6 zusammen ca. 35 Min. unter Druck, dann glasieren.", "Grundlage: Maangchi, eines der bekanntesten koreanischen Rezepte im Netz."]}, {"id": "beef-rendang", "name": "Beef Rendang (Indonesisches Kokos-Schmorfleisch)", "cat": "Asiatisch", "yield": "4 Portionen", "base": 4, "hydration": null, "scalable": true, "ing": [{"n": "Rindfleisch zum Schmoren (Wade, Hochrippe), 4 cm Würfel", "a": 800.0, "u": "g", "p": "rind_schmor"}, {"n": "Getrocknete Chilis (eingeweicht, entkernt)", "a": 8.0, "u": "Stk.", "p": "chiliflocken"}, {"n": "Schalotten", "a": 120.0, "u": "g", "p": "zwiebel"}, {"n": "Knoblauch", "a": 20.0, "u": "g", "p": "knoblauch"}, {"n": "Galgant", "a": 20.0, "u": "g", "p": "galgant"}, {"n": "Ingwer", "a": 15.0, "u": "g", "p": "ingwer"}, {"n": "Zitronengras (für die Paste)", "a": 2.0, "u": "Stk.", "p": "zitronengras"}, {"n": "Kurkuma, gemahlen", "a": 3.0, "u": "g", "p": "gewuerz"}, {"n": "Neutrales Öl", "a": 40.0, "u": "g", "p": "oel"}, {"n": "Zimtstange", "a": 1.0, "u": "Stk.", "p": "gewuerz"}, {"n": "Sternanis", "a": 2.0, "u": "Stk.", "p": "gewuerz"}, {"n": "Kardamomkapseln", "a": 4.0, "u": "Stk.", "p": "gewuerz"}, {"n": "Gewürznelken", "a": 4.0, "u": "Stk.", "p": "gewuerz"}, {"n": "Zitronengras (ganz, angeklopft)", "a": 1.0, "u": "Stk.", "p": "zitronengras"}, {"n": "Kokosmilch", "a": 400.0, "u": "g", "p": "kokosmilch"}, {"n": "Wasser", "a": 200.0, "u": "g", "p": "wasser"}, {"n": "Tamarindenpaste", "a": 20.0, "u": "g", "p": "tamarinde"}, {"n": "Kokosraspeln (für das Kerisik)", "a": 50.0, "u": "g", "p": "kokosraspeln"}, {"n": "Kaffirlimettenblätter", "a": 6.0, "u": "Stk.", "p": "gewuerz"}, {"n": "Palmzucker (oder brauner Zucker)", "a": 15.0, "u": "g", "p": "zucker"}, {"n": "Salz", "a": 8.0, "u": "g", "p": "salz"}], "steps": [{"t": "Würzpaste", "d": "10 Min.", "sec": 600, "wait": false, "b": "Chilis 10 Min. in heißem Wasser einweichen. Mit Schalotten, Knoblauch, Galgant, Ingwer, 2 Zitronengras (nur das Weiße), Kurkuma und einem Schluck Wasser im Mixer sehr fein pürieren."}, {"t": "Kerisik", "d": "8 Min.", "sec": 480, "wait": false, "b": "Kokosraspeln in einer trockenen Pfanne bei mittlerer Hitze unter ständigem Rühren goldbraun rösten. Im Mörser oder Mixer mahlen, bis eine ölige, dunkle Paste entsteht."}, {"t": "Paste anbraten", "d": "10 Min.", "sec": 600, "wait": false, "b": "Öl im schweren Topf erhitzen. Paste, Ganzgewürze und das angeklopfte Zitronengras unter Rühren braten, bis die Paste dunkler wird, stark duftet und sich das Öl absetzt."}, {"t": "Fleisch", "d": "3 Min.", "sec": 180, "wait": false, "b": "Fleisch zugeben und rundum in der Paste wenden."}, {"t": "Schmoren", "d": "Warten 1 h 30 Min.", "sec": 5400, "wait": true, "b": "Kokosmilch, Wasser und Tamarinde zugeben, aufkochen. Halb zugedeckt leise köcheln, alle 15 Min. umrühren."}, {"t": "Einkochen", "d": "Warten 30 Min.", "sec": 1800, "wait": true, "b": "Kerisik, fein geschnittene Kaffirblätter, Zucker und Salz einrühren. Ohne Deckel weiter einkochen und jetzt oft rühren, bis die Soße fast verschwunden ist, Öl austritt und das Fleisch dunkelbraun überzogen ist."}, {"t": "Servieren", "d": "5 Min.", "sec": 300, "wait": false, "b": "Ganzgewürze und Zitronengras herausnehmen, abschmecken. Dazu Jasminreis."}], "notes": ["Rendang ist kein Curry: Am Ende ist es fast trocken, die Paste klebt am Fleisch.", "Kerisik (geröstete Kokosraspeln) ist die geheime Zutat. Bitte nicht weglassen.", "In der letzten halben Stunde brennt es schnell an. Dann dabeibleiben und rühren.", "Schärfe: 8 getrocknete Chilis sind mittelscharf. Mild: 4 Stück.", "Am nächsten Tag noch besser. Hält 4 Tage im Kühlschrank, lässt sich gut einfrieren.", "Grundlage: Rasa Malaysia (4,6 Sterne bei über 700 Bewertungen)."]}, {"id": "buldak-ramen", "name": "Buldak-Ramen (cremig, hausgemacht)", "cat": "Asiatisch", "yield": "1 Portion", "base": 1, "hydration": null, "scalable": true, "ing": [{"n": "Ramen-Nudeln (ohne Würzbeutel)", "a": 90.0, "u": "g", "p": "ramen"}, {"n": "Wasser (für die Nudeln)", "a": 1500.0, "u": "g", "p": "wasser"}, {"n": "Japanische Mayonnaise (z. B. Kewpie)", "a": 25.0, "u": "g", "p": "mayonnaise"}, {"n": "Sojasauce", "a": 10.0, "u": "g", "p": "sojasauce"}, {"n": "Mirin", "a": 10.0, "u": "g", "p": "mirin"}, {"n": "Zucker", "a": 2.0, "u": "g", "p": "zucker"}, {"n": "Gochujang (optional, für echten Buldak-Geschmack)", "a": 10.0, "u": "g", "p": "gochujang"}, {"n": "Chili Crisp (z. B. Lao Gan Ma), plus mehr zum Servieren", "a": 15.0, "u": "g", "p": "chili_crisp"}, {"n": "Sahne", "a": 30.0, "u": "g", "p": "sahne"}, {"n": "Eigelb (Größe M)", "a": 1.0, "u": "Stk.", "p": "eier"}, {"n": "Hühner- oder Gemüsebrühe", "a": 200.0, "u": "g", "p": "bruehe"}, {"n": "Babyspinat", "a": 60.0, "u": "g", "p": "spinat"}, {"n": "Ei (für das Spiegelei, Größe L)", "a": 1.0, "u": "Stk.", "p": "eier"}, {"n": "Neutrales Öl", "a": 5.0, "u": "g", "p": "oel"}, {"n": "Frühlingszwiebel", "a": 15.0, "u": "g", "p": "fruehlingszwiebel"}, {"n": "Sesam, geröstet (optional)", "a": 2.0, "u": "g", "p": "sesam"}], "steps": [{"t": "Wasser aufsetzen", "d": "Warten 8 Min.", "sec": 480, "wait": true, "b": "Nudelwasser aufkochen (nicht salzen). In der Zeit Frühlingszwiebel in feine Ringe schneiden und das Ei für die Soße trennen."}, {"t": "Soße anrühren", "d": "2 Min.", "sec": 120, "wait": false, "b": "Im kalten Topf (Herd aus) Mayonnaise, Sojasauce, Mirin, Zucker, Gochujang, Chili Crisp, Sahne und Eigelb glatt rühren. Dann die Brühe schluckweise einrühren."}, {"t": "Spiegelei", "d": "4 Min.", "sec": 240, "wait": false, "b": "Öl in einer kleinen Pfanne erhitzen, Ei hineingleiten lassen und braten, bis der Rand knusprig ist und das Eigelb noch flüssig. Warm stellen."}, {"t": "Soße erhitzen", "d": "3 Min.", "sec": 180, "wait": false, "b": "Topf bei mittlerer Hitze unter ständigem Rühren erhitzen, bis die Soße dampft und leicht andickt. Nicht kochen lassen, sonst flockt das Eigelb. Auf kleinste Stufe stellen."}, {"t": "Nudeln und Spinat", "d": "Warten 3 Min.", "sec": 180, "wait": true, "b": "Nudeln 30 Sek. kürzer als auf der Packung kochen. Spinat für die letzten 30 Sek. mit ins Wasser geben. Alles gut abtropfen lassen."}, {"t": "Schwenken", "d": "1 Min.", "sec": 60, "wait": false, "b": "Nudeln in die Soße geben und 30–60 Sek. schwenken, bis sie die Soße aufnehmen. Abschmecken: Zu dick: Schluck Brühe. Zu flach: etwas Sojasauce."}, {"t": "Anrichten", "d": "1 Min.", "sec": 60, "wait": false, "b": "In eine vorgewärmte Schale füllen. Spinat, Spiegelei, Frühlingszwiebel und Sesam darauf, mit einem Löffel Chili Crisp servieren."}], "notes": ["Bachan's Barbecue Sauce gibt es in Deutschland kaum. Sojasauce, Mirin und Zucker ersetzen sie. Hast du Bachan's: 20 g davon statt dieser drei.", "Die Soße darf nur dampfen, nie kochen. Gerinnt sie trotzdem: Herd aus, einen Schluck kalte Brühe zugeben und kräftig rühren.", "Schärfe: Chili Crisp ist mild bis mittel. Gochujang bringt den typischen Buldak-Geschmack. Schärfer: 1–2 g koreanische Chiliflocken (Gochugaru) in die Soße.", "Nudeln: Instant-Ramen ohne Würzbeutel (z. B. aus dem Asia-Markt) oder frische Ramen aus dem Kühlregal. Udon gehen auch.", "Optimiert gegenüber dem Original: Spinat gart im Nudelwasser mit (ein Topf weniger), Mengen in Gramm, Ersatz für Bachan's, Hinweise gegen Gerinnen."]}, {"id": "onigiri-reis-grundrezept", "name": "Onigiri Grundrezept (Reis und Formen)", "cat": "Asiatisch", "yield": "8 Onigiri (à ca. 110 g)", "base": 8, "hydration": null, "scalable": true, "ing": [{"n": "Japanischer Rundkornreis (Sushi-Reis)", "a": 400.0, "u": "g", "p": "sushireis"}, {"n": "Wasser (zum Kochen)", "a": 480.0, "u": "g", "p": "wasser"}, {"n": "Salz (für die Hände)", "a": 6.0, "u": "g", "p": "salz"}, {"n": "Nori-Blätter (halbiert)", "a": 4.0, "u": "Stk.", "p": "nori"}, {"n": "Füllung nach Wahl (siehe Füllungen)", "a": 160.0, "u": "g", "p": "_skip"}], "steps": [{"t": "Reis waschen", "d": "5 Min.", "sec": 300, "wait": false, "b": "Reis in einer Schüssel mit kaltem Wasser kreisend waschen, Wasser abgießen. 4–5-mal wiederholen, bis das Wasser fast klar ist. In einem Sieb abtropfen lassen."}, {"t": "Einweichen", "d": "Warten 30 Min.", "sec": 1800, "wait": true, "b": "Reis mit den 480 g Wasser in einen Topf mit dicht schließendem Deckel geben und quellen lassen. So wird er gleichmäßig gar."}, {"t": "Kochen", "d": "Warten 12 Min.", "sec": 720, "wait": true, "b": "Mit Deckel aufkochen, dann auf kleinste Stufe stellen und 12 Min. garen. Deckel nicht öffnen."}, {"t": "Nachquellen", "d": "Warten 10 Min.", "sec": 600, "wait": true, "b": "Herd aus, Deckel drauf lassen. Danach Reis mit einem nassen Spatel locker auflockern. Reiskocher: Einstellung „Weißer Reis“, gleiche Wassermenge."}, {"t": "Abkühlen", "d": "Warten 10 Min.", "sec": 600, "wait": true, "b": "Reis in eine Schüssel geben und mit einem feuchten Tuch abdecken, bis er gut handwarm ist. Zu heiß verbrennt die Hände, kalter Reis klebt nicht mehr."}, {"t": "Formen", "d": "15 Min.", "sec": 900, "wait": false, "b": "Hände mit Wasser anfeuchten, eine Prise Salz in den Handflächen verreiben. 110 g Reis nehmen (Küchenwaage), flach drücken, Mulde machen, ca. 20 g Füllung hinein. Mit etwas Reis abdecken. Mit beiden Händen zum Dreieck formen: 3–4-mal drehen und sanft drücken, nicht quetschen."}, {"t": "Nori", "d": "5 Min.", "sec": 300, "wait": false, "b": "Erst kurz vor dem Essen einen halben Nori-Streifen um die Unterseite legen, dann bleibt er knusprig. Für unterwegs: Onigiri in Frischhaltefolie wickeln, Nori separat mitnehmen."}], "notes": ["Tipp mit Folie: Reis auf Frischhaltefolie legen, Füllung drauf, Folie zudrehen und formen. Sauberer und hygienischer.", "Nicht in den Kühlschrank: Der Reis wird hart. Bei Raumtemperatur am selben Tag essen. Mit Fisch oder Fleisch gefüllt höchstens 4–6 h ungekühlt.", "Mengen der Füllungen in diesem Kapitel sind jeweils für 8 Onigiri gerechnet."]}, {"id": "onigiri-fuellung-tuna-mayo", "name": "Onigiri-Füllung: Thunfisch-Mayo", "cat": "Asiatisch", "yield": "Füllung für 8 Onigiri", "base": 8, "hydration": null, "scalable": true, "ing": [{"n": "Thunfisch im eigenen Saft (abgetropft)", "a": 150.0, "u": "g", "p": "thunfisch"}, {"n": "Japanische Mayonnaise (z. B. Kewpie)", "a": 45.0, "u": "g", "p": "mayonnaise"}, {"n": "Sojasauce", "a": 5.0, "u": "g", "p": "sojasauce"}, {"n": "Frühlingszwiebel (nur das Grün, optional)", "a": 10.0, "u": "g", "p": "fruehlingszwiebel"}], "steps": [{"t": "Abtropfen", "d": "3 Min.", "sec": 180, "wait": false, "b": "Thunfisch in einem Sieb gut ausdrücken. Je trockener, desto weniger weicht der Reis durch."}, {"t": "Mischen", "d": "3 Min.", "sec": 180, "wait": false, "b": "Mit einer Gabel fein zerpflücken, Mayonnaise und Sojasauce unterrühren. Frühlingszwiebelgrün fein schneiden und untermischen."}, {"t": "Füllen", "d": "2 Min.", "sec": 120, "wait": false, "b": "Je ca. 25 g in die Mulde im Reis geben. Die Füllung nicht bis zum Rand verteilen, sonst hält das Onigiri nicht."}], "notes": ["Der Klassiker aus jedem japanischen Konbini (Tsuna Mayo).", "Ohne Kewpie: normale Mayonnaise plus 1 g Zucker und ein paar Tropfen Reisessig.", "Schärfer: 2 g Sriracha oder etwas Shichimi Togarashi dazu."]}, {"id": "onigiri-fuellung-lachs-shiozake", "name": "Onigiri-Füllung: Gesalzener Lachs (Shiozake)", "cat": "Asiatisch", "yield": "Füllung für 8 Onigiri", "base": 8, "hydration": null, "scalable": true, "ing": [{"n": "Lachsfilet mit Haut", "a": 200.0, "u": "g", "p": "lachs"}, {"n": "Salz", "a": 4.0, "u": "g", "p": "salz"}, {"n": "Sesam, geröstet (optional)", "a": 5.0, "u": "g", "p": "sesam"}], "steps": [{"t": "Salzen", "d": "2 Min.", "sec": 120, "wait": false, "b": "Lachs trocken tupfen und von beiden Seiten gleichmäßig salzen."}, {"t": "Ziehen lassen", "d": "Warten 30 Min.", "sec": 1800, "wait": true, "b": "Im Kühlschrank ziehen lassen. Das Salz entzieht Wasser, der Fisch wird fester und würziger. Länger geht auch, bis über Nacht."}, {"t": "Garen", "d": "10 Min.", "sec": 600, "wait": false, "b": "Austretende Flüssigkeit abtupfen. Im Ofen bei 200 °C Ober-/Unterhitze ca. 10 Min. backen oder in einer beschichteten Pfanne auf der Hautseite 6 Min., dann 3 Min. auf der anderen Seite."}, {"t": "Zerpflücken", "d": "5 Min.", "sec": 300, "wait": false, "b": "Etwas abkühlen lassen, Haut und Gräten entfernen, Fisch mit einer Gabel grob zerpflücken. Sesam unterheben. Je ca. 20 g als Füllung."}], "notes": ["Schnelle Variante: fertigen Räucherlachs klein schneiden, dann entfallen Salzen und Garen.", "Hält gegart abgedeckt 2 Tage im Kühlschrank. Vor dem Füllen auf Raumtemperatur kommen lassen."]}, {"id": "onigiri-fuellung-okaka", "name": "Onigiri-Füllung: Okaka (Bonito-Soja)", "cat": "Asiatisch", "yield": "Füllung für 8 Onigiri", "base": 8, "hydration": null, "scalable": true, "ing": [{"n": "Bonitoflocken (Katsuobushi)", "a": 15.0, "u": "g", "p": "bonito"}, {"n": "Sojasauce", "a": 15.0, "u": "g", "p": "sojasauce"}, {"n": "Mirin", "a": 5.0, "u": "g", "p": "mirin"}, {"n": "Sesam, geröstet", "a": 3.0, "u": "g", "p": "sesam"}], "steps": [{"t": "Anrösten", "d": "2 Min.", "sec": 120, "wait": false, "b": "Bonitoflocken in einer trockenen Pfanne bei mittlerer Hitze 1–2 Min. rösten, bis sie duften. Ständig rühren, sie verbrennen schnell."}, {"t": "Würzen", "d": "2 Min.", "sec": 120, "wait": false, "b": "Pfanne vom Herd nehmen, Sojasauce und Mirin unterrühren, bis die Flocken die Flüssigkeit aufgesogen haben. Sesam dazu."}, {"t": "Füllen", "d": "2 Min.", "sec": 120, "wait": false, "b": "Abkühlen lassen. Je ca. 4 g (ein gehäufter Teelöffel) als Füllung. Das ist wenig, schmeckt aber intensiv."}], "notes": ["Klassische, lange haltbare Füllung ohne Kühlung, gut für Ausflüge.", "Ohne Mirin: 2 g Zucker nehmen.", "Alternativ direkt unter den Reis mischen statt füllen, dann reicht die doppelte Menge für 8 Onigiri."]}, {"id": "onigiri-fuellung-teriyaki-haehnchen", "name": "Onigiri-Füllung: Teriyaki-Hähnchen", "cat": "Asiatisch", "yield": "Füllung für 8 Onigiri", "base": 8, "hydration": null, "scalable": true, "ing": [{"n": "Hähnchenschenkel ohne Haut und Knochen", "a": 250.0, "u": "g", "p": "haehnchen"}, {"n": "Sojasauce", "a": 20.0, "u": "g", "p": "sojasauce"}, {"n": "Mirin", "a": 20.0, "u": "g", "p": "mirin"}, {"n": "Sake (oder Wasser)", "a": 10.0, "u": "g", "p": "sake"}, {"n": "Zucker", "a": 8.0, "u": "g", "p": "zucker"}, {"n": "Neutrales Öl", "a": 5.0, "u": "g", "p": "oel"}], "steps": [{"t": "Schneiden", "d": "5 Min.", "sec": 300, "wait": false, "b": "Hähnchen in ca. 1 cm große Würfel schneiden. Kleine Stücke lassen sich gut in den Reis einbetten."}, {"t": "Soße anrühren", "d": "1 Min.", "sec": 60, "wait": false, "b": "Sojasauce, Mirin, Sake und Zucker verrühren."}, {"t": "Anbraten", "d": "6 Min.", "sec": 360, "wait": false, "b": "Öl in der Pfanne stark erhitzen, Hähnchen rundum goldbraun und durch braten."}, {"t": "Glasieren", "d": "3 Min.", "sec": 180, "wait": false, "b": "Soße zugeben und unter Rühren einkochen, bis sie sirupartig am Fleisch klebt und kaum noch Flüssigkeit in der Pfanne ist."}, {"t": "Abkühlen", "d": "Warten 10 Min.", "sec": 600, "wait": true, "b": "Auf einem Teller abkühlen lassen. Je ca. 25 g als Füllung. Zu nasse Füllung macht das Onigiri instabil."}], "notes": ["Hähnchenschenkel bleiben saftiger als Brust.", "Variante: zum Schluss 5 g Mayonnaise unterrühren (Teri-Mayo)."]}, {"id": "onigiri-fuellung-shiitake-kombu", "name": "Onigiri-Füllung: Shiitake-Kombu (vegan)", "cat": "Asiatisch", "yield": "Füllung für 8 Onigiri", "base": 8, "hydration": null, "scalable": true, "ing": [{"n": "Getrocknete Shiitake", "a": 15.0, "u": "g", "p": "shiitake"}, {"n": "Kombu (getrocknet)", "a": 10.0, "u": "g", "p": "kombu"}, {"n": "Wasser (zum Einweichen)", "a": 250.0, "u": "g", "p": "wasser"}, {"n": "Sojasauce", "a": 30.0, "u": "g", "p": "sojasauce"}, {"n": "Mirin", "a": 30.0, "u": "g", "p": "mirin"}, {"n": "Zucker", "a": 10.0, "u": "g", "p": "zucker"}, {"n": "Reisessig", "a": 5.0, "u": "g", "p": "reisessig"}, {"n": "Sesam, geröstet", "a": 3.0, "u": "g", "p": "sesam"}], "steps": [{"t": "Einweichen", "d": "Warten 30 Min.", "sec": 1800, "wait": true, "b": "Shiitake und Kombu im Wasser einweichen, bis beides weich ist. Einweichwasser aufheben."}, {"t": "Schneiden", "d": "5 Min.", "sec": 300, "wait": false, "b": "Shiitake-Stiele entfernen, Hüte in feine Streifen schneiden. Kombu in 2–3 mm feine Streifen schneiden."}, {"t": "Einkochen", "d": "Warten 20 Min.", "sec": 1200, "wait": true, "b": "Pilze, Kombu, 100 g vom Einweichwasser, Sojasauce, Mirin, Zucker und Essig in einen kleinen Topf geben. Ohne Deckel leise köcheln, gelegentlich rühren."}, {"t": "Fertig reduzieren", "d": "3 Min.", "sec": 180, "wait": false, "b": "Weiter rühren, bis fast keine Flüssigkeit mehr da ist und alles glänzt. Sesam unterheben, abkühlen lassen. Je ca. 12 g als Füllung."}], "notes": ["Japanisch heißt das Tsukudani. Hält im Glas 1 Woche im Kühlschrank.", "Restliches Einweichwasser ist eine gute Basis für Misosuppe."]}, {"id": "oyakodon", "name": "Oyakodon (Hähnchen-Ei-Reisschale)", "cat": "Asiatisch", "yield": "2 Portionen", "base": 2, "hydration": null, "scalable": true, "ing": [{"n": "Sushi-Reis (roh)", "a": 200.0, "u": "g", "p": "sushireis"}, {"n": "Hähnchenschenkel ohne Haut", "a": 300.0, "u": "g", "p": "haehnchen"}, {"n": "Zwiebel", "a": 150.0, "u": "g", "p": "zwiebel"}, {"n": "Eier", "a": 4.0, "u": "Stk.", "p": "eier"}, {"n": "Dashi oder Wasser", "a": 120.0, "u": "g", "p": "wasser"}, {"n": "Sojasauce (japanisch)", "a": 30.0, "u": "g", "p": "sojasauce"}, {"n": "Mirin", "a": 30.0, "u": "g", "p": "mirin"}, {"n": "Zucker", "a": 10.0, "u": "g", "p": "zucker"}, {"n": "Frühlingszwiebel", "a": 15.0, "u": "g", "p": "fruehlingszwiebel"}], "steps": [{"t": "Reis kochen", "d": "3 Min.", "sec": 180, "wait": false, "b": "Reis waschen, bis das Wasser klar ist. Mit 260 g Wasser aufkochen, Deckel drauf."}, {"t": "Reis garen und ziehen lassen", "d": "Warten 22 Min.", "sec": 1320, "wait": true, "b": "12 Min. auf kleinster Stufe, dann vom Herd und 10 Min. zugedeckt ziehen lassen. Währenddessen weiter."}, {"t": "Schnippeln", "d": "5 Min.", "sec": 300, "wait": false, "b": "Hähnchen in 2 bis 3 cm Stücke, Zwiebel in feine Streifen, Frühlingszwiebel in Ringe."}, {"t": "Sud und Zwiebel", "d": "3 Min.", "sec": 180, "wait": false, "b": "Dashi, Sojasauce, Mirin und Zucker in einer kleinen Pfanne (ca. 20 cm) aufkochen. Zwiebel 3 Min. darin köcheln."}, {"t": "Hähnchen garen", "d": "Warten 6 Min.", "sec": 360, "wait": true, "b": "Hähnchen dazugeben, Deckel drauf, bei mittlerer Hitze garen, bis es durch ist. Einmal wenden."}, {"t": "Ei in zwei Runden", "d": "2 Min.", "sec": 120, "wait": false, "b": "Eier nur locker verquirlen (Schlieren sind gewollt). Zwei Drittel kreisförmig darübergießen, Deckel drauf, 30 Sek. Rest dazu, 30 Sek., Herd aus. Das Ei soll noch leicht flüssig glänzen."}, {"t": "Anrichten", "d": "1 Min.", "sec": 60, "wait": false, "b": "Reis in Schüsseln, Hähnchen-Ei samt Sud darübergleiten lassen, Frühlingszwiebel drauf."}], "notes": ["Pro mittlerer Pfanne maximal 2 Portionen, sonst zu viel Sud und das Ei stockt ungleichmäßig.", "Typischer Fehler: Ei zu lange garen, dann wird es Rührei. Herd aus, solange es noch glänzt.", "Ohne Mirin: je 30 g Mirin 30 g Wasser + 10 g Zucker.", "Vegetarisch: fester Tofu, ausgedrückt und goldbraun angebraten, nur 2 Min. im Sud ziehen lassen.", "Quellen: Just One Cookbook (Namiko Chen), The Woks of Life (4,8/5 bei 9 Stimmen). Eigene Fassung."]}, {"id": "gyudon", "name": "Gyudon (Rindfleisch-Reisschale)", "cat": "Asiatisch", "yield": "2 Portionen", "base": 2, "hydration": null, "scalable": true, "ing": [{"n": "Sushi-Reis (roh)", "a": 200.0, "u": "g", "p": "sushireis"}, {"n": "Rind, hauchdünn (Ribeye oder Hochrippe)", "a": 250.0, "u": "g", "p": "rind_kurz"}, {"n": "Zwiebel", "a": 150.0, "u": "g", "p": "zwiebel"}, {"n": "Dashi oder Wasser", "a": 150.0, "u": "g", "p": "wasser"}, {"n": "Sojasauce (japanisch)", "a": 35.0, "u": "g", "p": "sojasauce"}, {"n": "Mirin", "a": 30.0, "u": "g", "p": "mirin"}, {"n": "Sake (oder Wasser)", "a": 30.0, "u": "g", "p": "sake"}, {"n": "Zucker", "a": 12.0, "u": "g", "p": "zucker"}, {"n": "Ingwer, gerieben", "a": 5.0, "u": "g", "p": "ingwer"}, {"n": "Frühlingszwiebel", "a": 15.0, "u": "g", "p": "fruehlingszwiebel"}, {"n": "Eigelb (optional, roh)", "a": 2.0, "u": "Stk.", "p": "eier"}], "steps": [{"t": "Reis aufsetzen", "d": "3 Min.", "sec": 180, "wait": false, "b": "Dazu Reis: 200 g Sushi-Reis waschen, mit 260 g Wasser 12 Min. kochen, 10 Min. ziehen lassen (siehe Onigiri Grundrezept)."}, {"t": "Fleisch vorbereiten", "d": "Warten 15 Min.", "sec": 900, "wait": true, "b": "Rind 15 Min. ins Gefrierfach legen, dann gegen die Faser hauchdünn (2 mm) schneiden. Zwiebel in Streifen."}, {"t": "Sud", "d": "3 Min.", "sec": 180, "wait": false, "b": "Dashi, Sojasauce, Mirin, Sake, Zucker und Ingwer aufkochen. Zwiebel 4 Min. weich köcheln."}, {"t": "Rind ziehen lassen", "d": "3 Min.", "sec": 180, "wait": false, "b": "Fleisch auseinanderzupfen und in den Sud legen. Bei mittlerer Hitze nur 2 bis 3 Min. ziehen lassen, Schaum abschöpfen."}, {"t": "Anrichten", "d": "1 Min.", "sec": 60, "wait": false, "b": "Reis in Schüsseln, Fleisch und Zwiebeln darauf, etwas Sud darüber. Mit Frühlingszwiebel und nach Wunsch einem Eigelb in der Mitte (Tsukimi-Gyudon)."}], "notes": ["Marmoriertes Fleisch nehmen, mageres wird zäh.", "Typischer Fehler: Fleisch zu lange kochen. Kurz ziehen lassen reicht.", "Schnell-Tipp: dünne Rinderscheiben für Shabu-Shabu aus dem Asia-Markt sparen das Schneiden.", "Mit Schweinenacken heißt es Butadon, gleiche Garzeit.", "Quellen: Just One Cookbook (Gyudon, 20-Min.-Rezept), The Woks of Life. Eigene Fassung."]}, {"id": "tonkatsu", "name": "Tonkatsu (Japanisches Schweineschnitzel)", "cat": "Asiatisch", "yield": "2 Portionen", "base": 2, "hydration": null, "scalable": true, "ing": [{"n": "Schweinelachs / Kotelett ohne Knochen, 1,5 cm dick", "a": 2.0, "u": "Stk.", "p": "schweinelachs"}, {"n": "Salz", "a": 3.0, "u": "g", "p": "salz"}, {"n": "Pfeffer", "a": 1.0, "u": "g", "p": "pfeffer"}, {"n": "Mehl", "a": 20.0, "u": "g", "p": "mehl"}, {"n": "Eier", "a": 1.0, "u": "Stk.", "p": "eier"}, {"n": "Panko", "a": 60.0, "u": "g", "p": "panko"}, {"n": "Neutrales Öl zum Frittieren", "a": 600.0, "u": "g", "p": "oel"}, {"n": "Weißkohl, fein gehobelt", "a": 150.0, "u": "g", "p": "weisskohl"}, {"n": "Ketchup (Soße)", "a": 30.0, "u": "g", "p": "ketchup"}, {"n": "Worcestershiresauce (Soße)", "a": 30.0, "u": "g", "p": "worcester"}, {"n": "Sojasauce (Soße)", "a": 5.0, "u": "g", "p": "sojasauce"}, {"n": "Zucker (Soße)", "a": 5.0, "u": "g", "p": "zucker"}], "steps": [{"t": "Kohl wässern", "d": "3 Min.", "sec": 180, "wait": false, "b": "Weißkohl hauchdünn hobeln und in Eiswasser legen, dann wird er knackig."}, {"t": "Fleisch vorbereiten", "d": "4 Min.", "sec": 240, "wait": false, "b": "Fettrand alle 2 cm einschneiden, damit sich das Fleisch nicht wölbt. Leicht klopfen, wieder in Form drücken, salzen und pfeffern."}, {"t": "Panieren", "d": "4 Min.", "sec": 240, "wait": false, "b": "Erst Mehl (abklopfen), dann verquirltes Ei, dann Panko fest andrücken."}, {"t": "Öl erhitzen", "d": "Warten 8 Min.", "sec": 480, "wait": true, "b": "Öl in einem Topf auf 170 °C bringen. Test: ein Panko-Krümel sinkt kurz und steigt sofort auf."}, {"t": "Frittieren", "d": "Warten 6 Min.", "sec": 360, "wait": true, "b": "Einzeln frittieren, 3 Min. je Seite, bis goldbraun. Die ersten 30 Sek. nicht bewegen."}, {"t": "Ruhen lassen", "d": "Warten 3 Min.", "sec": 180, "wait": true, "b": "Auf einem Gitter 3 Min. ruhen lassen, dabei gart der Kern nach. Kerntemperatur 63 °C."}, {"t": "Soße und Anrichten", "d": "2 Min.", "sec": 120, "wait": false, "b": "Ketchup, Worcester, Soja und Zucker verrühren. Schnitzel in 2 cm Streifen schneiden, mit abgetropftem Kohl und Reis servieren."}], "notes": ["Typischer Fehler: zu viele Stücke auf einmal, dann fällt die Öltemperatur und die Panade saugt sich voll.", "Ohne Frittieren: Panko vorher in der Pfanne mit 1 EL Öl goldbraun rösten, Schnitzel panieren und 20 Min. bei 200 °C auf dem Gitter backen.", "Katsudon: Schnitzel in Streifen wie beim Oyakodon in Sud mit Zwiebel und Ei garen.", "Chicken Katsu: Hähnchenbrust halbiert, gleiche Panade, 4 Min. je Seite.", "Quellen: Just One Cookbook (Tonkatsu und Baked Tonkatsu), RecipeTin Japan. Eigene Fassung."]}, {"id": "karaage", "name": "Karaage (Japanisches Frittier-Hähnchen)", "cat": "Asiatisch", "yield": "2 Portionen", "base": 2, "hydration": null, "scalable": true, "ing": [{"n": "Hähnchenschenkel ohne Knochen, mit Haut", "a": 400.0, "u": "g", "p": "haehnchen"}, {"n": "Sojasauce (japanisch)", "a": 25.0, "u": "g", "p": "sojasauce"}, {"n": "Sake (oder Wasser)", "a": 15.0, "u": "g", "p": "sake"}, {"n": "Mirin", "a": 10.0, "u": "g", "p": "mirin"}, {"n": "Ingwer, gerieben", "a": 8.0, "u": "g", "p": "ingwer"}, {"n": "Knoblauch, gerieben", "a": 5.0, "u": "g", "p": "knoblauch"}, {"n": "Kartoffel- oder Speisestärke", "a": 40.0, "u": "g", "p": "staerke"}, {"n": "Neutrales Öl zum Frittieren", "a": 600.0, "u": "g", "p": "oel"}, {"n": "Zitrone", "a": 0.5, "u": "Stk.", "p": "zitrone"}, {"n": "Japanische Mayonnaise (zum Dippen)", "a": 30.0, "u": "g", "p": "mayonnaise"}], "steps": [{"t": "Schneiden", "d": "4 Min.", "sec": 240, "wait": false, "b": "Hähnchen in große Stücke (ca. 5 x 4 cm) schneiden. Große Stücke bleiben saftiger."}, {"t": "Marinieren", "d": "Warten 30 Min.", "sec": 1800, "wait": true, "b": "Mit Sojasauce, Sake, Mirin, Ingwer und Knoblauch mischen, abgedeckt 30 Min. bis 1 Std. im Kühlschrank ziehen lassen."}, {"t": "Öl erhitzen", "d": "Warten 8 Min.", "sec": 480, "wait": true, "b": "Öl auf 170 °C erhitzen."}, {"t": "Bemehlen", "d": "3 Min.", "sec": 180, "wait": false, "b": "Marinade abtropfen lassen, Stücke kurz auf Küchenpapier legen, dann rundum in Stärke wenden."}, {"t": "Erstes Frittieren", "d": "Warten 4 Min.", "sec": 240, "wait": true, "b": "In kleinen Portionen 3 bis 4 Min. frittieren, bis hellgold. Herausnehmen."}, {"t": "Ruhen", "d": "Warten 4 Min.", "sec": 240, "wait": true, "b": "Auf Gitter 4 Min. ruhen lassen, die Resthitze gart innen weiter."}, {"t": "Zweites Frittieren", "d": "1 Min.", "sec": 60, "wait": false, "b": "Öl auf 190 °C, alles nochmals 1 Min. knusprig frittieren. Mit Zitrone, Mayo und Reis servieren."}], "notes": ["Doppelt frittieren ist der Trick für Knusprigkeit ohne trockenes Fleisch.", "Typischer Fehler: Marinade nicht abgetropft, dann klumpt die Stärke und spritzt.", "Kartoffelstärke wird knuspriger als Maisstärke.", "Tofu-Karaage: fester Tofu, gut ausgedrückt, in Stücke gerissen, nur 15 Min. marinieren.", "Quellen: RecipeTin Japan (5/5 bei 30 Stimmen), Just One Cookbook. Eigene Fassung."]}, {"id": "japanisches-curry", "name": "Japanisches Curry (Kare Raisu)", "cat": "Asiatisch", "yield": "4 Portionen", "base": 4, "hydration": null, "scalable": true, "ing": [{"n": "Sushi-Reis (roh)", "a": 400.0, "u": "g", "p": "sushireis"}, {"n": "Hähnchenschenkel ohne Haut (oder Rind)", "a": 500.0, "u": "g", "p": "haehnchen"}, {"n": "Zwiebeln", "a": 300.0, "u": "g", "p": "zwiebel"}, {"n": "Karotten", "a": 200.0, "u": "g", "p": "karotten"}, {"n": "Kartoffeln (festkochend)", "a": 400.0, "u": "g", "p": "kartoffeln"}, {"n": "Neutrales Öl", "a": 15.0, "u": "g", "p": "oel"}, {"n": "Wasser oder Hühnerbrühe", "a": 800.0, "u": "g", "p": "bruehe"}, {"n": "Apfel, gerieben", "a": 80.0, "u": "g", "p": "apfel"}, {"n": "Butter (Roux)", "a": 50.0, "u": "g", "p": "butter"}, {"n": "Mehl (Roux)", "a": 50.0, "u": "g", "p": "mehl"}, {"n": "Currypulver (Roux)", "a": 20.0, "u": "g", "p": "gewuerz"}, {"n": "Garam Masala (Roux)", "a": 4.0, "u": "g", "p": "gewuerz"}, {"n": "Ketchup", "a": 20.0, "u": "g", "p": "ketchup"}, {"n": "Sojasauce", "a": 15.0, "u": "g", "p": "sojasauce"}, {"n": "Worcestershiresauce", "a": 10.0, "u": "g", "p": "worcester"}, {"n": "Honig", "a": 10.0, "u": "g", "p": "honig"}, {"n": "Salz", "a": 6.0, "u": "g", "p": "salz"}], "steps": [{"t": "Reis aufsetzen", "d": "3 Min.", "sec": 180, "wait": false, "b": "400 g Reis waschen, mit 520 g Wasser kochen wie im Grundrezept."}, {"t": "Schnippeln", "d": "10 Min.", "sec": 600, "wait": false, "b": "Zwiebeln in Spalten, Karotten und Kartoffeln in 3 cm Stücke (Kanten leicht abrunden), Hähnchen in mundgerechte Stücke."}, {"t": "Anbraten", "d": "8 Min.", "sec": 480, "wait": false, "b": "Öl im Topf, Zwiebeln 5 Min. glasig, dann Hähnchen kurz anbraten, Karotten und Kartoffeln dazu."}, {"t": "Köcheln", "d": "Warten 20 Min.", "sec": 1200, "wait": true, "b": "Brühe und geriebenen Apfel dazu, aufkochen, Schaum abschöpfen. Halb zugedeckt köcheln, bis die Kartoffeln weich sind."}, {"t": "Roux rösten", "d": "8 Min.", "sec": 480, "wait": false, "b": "Parallel Butter in einer Pfanne schmelzen, Mehl einrühren und bei kleiner Hitze unter Rühren hellbraun rösten. Vom Herd, Currypulver und Garam Masala einrühren."}, {"t": "Binden", "d": "3 Min.", "sec": 180, "wait": false, "b": "Herd unter dem Topf aus. Etwas Brühe in die Roux rühren, dann alles zurück in den Topf geben und glatt rühren."}, {"t": "Abschmecken", "d": "Warten 8 Min.", "sec": 480, "wait": true, "b": "Ketchup, Soja, Worcester, Honig und Salz dazu. 5 bis 10 Min. leise köcheln, bis es sämig ist. Neben dem Reis anrichten."}], "notes": ["Abkürzung: statt Roux 1 Packung Curry-Würfel (z. B. Golden Curry, ca. 100 g für 800 g Wasser). Dann Salz weglassen, die Würfel sind salzig.", "Typischer Fehler: Roux in kochende Flüssigkeit, dann klumpt es. Immer Herd aus beim Einrühren.", "Am nächsten Tag schmeckt es besser. Kartoffeln vor dem Einfrieren entfernen, sie werden sonst mehlig.", "Vegetarisch: Tofu oder Kichererbsen, Gemüsebrühe.", "Quellen: Just One Cookbook (Simple Chicken Curry und Curry Roux from Scratch), The Guardian (Felicity Cloake). Eigene Fassung."]}, {"id": "yakisoba", "name": "Yakisoba (Gebratene Nudeln japanisch)", "cat": "Asiatisch", "yield": "2 Portionen", "base": 2, "hydration": null, "scalable": true, "ing": [{"n": "Mie- oder Yakisoba-Nudeln (frisch oder vorgekocht)", "a": 300.0, "u": "g", "p": "mie"}, {"n": "Schweinebauch, dünn geschnitten", "a": 150.0, "u": "g", "p": "schwein_stueck"}, {"n": "Weißkohl", "a": 150.0, "u": "g", "p": "weisskohl"}, {"n": "Zwiebel", "a": 80.0, "u": "g", "p": "zwiebel"}, {"n": "Karotte", "a": 60.0, "u": "g", "p": "karotten"}, {"n": "Sojasprossen (optional)", "a": 80.0, "u": "g", "p": "sojasprossen"}, {"n": "Neutrales Öl", "a": 15.0, "u": "g", "p": "oel"}, {"n": "Worcestershiresauce (Soße)", "a": 30.0, "u": "g", "p": "worcester"}, {"n": "Austernsauce (Soße)", "a": 15.0, "u": "g", "p": "austernsauce"}, {"n": "Ketchup (Soße)", "a": 15.0, "u": "g", "p": "ketchup"}, {"n": "Sojasauce (Soße)", "a": 10.0, "u": "g", "p": "sojasauce"}, {"n": "Zucker (Soße)", "a": 8.0, "u": "g", "p": "zucker"}, {"n": "Frühlingszwiebel", "a": 15.0, "u": "g", "p": "fruehlingszwiebel"}], "steps": [{"t": "Soße mischen", "d": "2 Min.", "sec": 120, "wait": false, "b": "Worcester, Austernsauce, Ketchup, Soja und Zucker verrühren."}, {"t": "Schnippeln", "d": "6 Min.", "sec": 360, "wait": false, "b": "Kohl in 3 cm Stücke, Zwiebel in Streifen, Karotte in feine Stifte, Schweinebauch in 3 cm Stücke."}, {"t": "Nudeln lockern", "d": "2 Min.", "sec": 120, "wait": false, "b": "Nudeln kurz mit heißem Wasser übergießen und auseinanderzupfen, gut abtropfen."}, {"t": "Fleisch braten", "d": "3 Min.", "sec": 180, "wait": false, "b": "Öl in Wok oder großer Pfanne, Schweinebauch bei hoher Hitze knusprig braten."}, {"t": "Gemüse", "d": "3 Min.", "sec": 180, "wait": false, "b": "Zwiebel, Karotte, Kohl dazu, 2 bis 3 Min. braten, der Kohl soll noch Biss haben."}, {"t": "Nudeln und Soße", "d": "3 Min.", "sec": 180, "wait": false, "b": "Nudeln und Sprossen dazu, Soße darüber, alles 2 Min. kräftig schwenken, bis die Soße an den Nudeln klebt. Mit Frühlingszwiebel servieren."}], "notes": ["Typischer Fehler: zu wenig Hitze, dann dämpft alles. Lieber in 2 Runden braten.", "Klassisch mit eingelegtem rotem Ingwer (Beni Shoga) und Aonori.", "Vegetarisch: Tofu statt Schwein, Sojasauce statt Austernsauce.", "Quellen: Just One Cookbook (Yakisoba), RecipeTin Japan. Eigene Fassung."]}, {"id": "okonomiyaki", "name": "Okonomiyaki (Osaka-Kohlpfannkuchen)", "cat": "Asiatisch", "yield": "2 Stück", "base": 2, "hydration": null, "scalable": true, "ing": [{"n": "Mehl", "a": 100.0, "u": "g", "p": "mehl"}, {"n": "Backpulver", "a": 2.0, "u": "g", "p": "backpulver"}, {"n": "Dashi oder Wasser", "a": 120.0, "u": "g", "p": "wasser"}, {"n": "Eier", "a": 2.0, "u": "Stk.", "p": "eier"}, {"n": "Weißkohl", "a": 300.0, "u": "g", "p": "weisskohl"}, {"n": "Frühlingszwiebeln", "a": 30.0, "u": "g", "p": "fruehlingszwiebel"}, {"n": "Schweinebauch, dünne Scheiben", "a": 120.0, "u": "g", "p": "schwein_stueck"}, {"n": "Neutrales Öl", "a": 10.0, "u": "g", "p": "oel"}, {"n": "Worcestershiresauce (Soße)", "a": 30.0, "u": "g", "p": "worcester"}, {"n": "Ketchup (Soße)", "a": 15.0, "u": "g", "p": "ketchup"}, {"n": "Honig (Soße)", "a": 8.0, "u": "g", "p": "honig"}, {"n": "Sojasauce (Soße)", "a": 5.0, "u": "g", "p": "sojasauce"}, {"n": "Japanische Mayonnaise", "a": 30.0, "u": "g", "p": "mayonnaise"}, {"n": "Bonitoflocken (optional)", "a": 3.0, "u": "g", "p": "bonito"}, {"n": "Nori, zerbröselt (optional)", "a": 1.0, "u": "g", "p": "nori"}], "steps": [{"t": "Teig", "d": "3 Min.", "sec": 180, "wait": false, "b": "Mehl, Backpulver und Dashi glatt rühren."}, {"t": "Ruhen", "d": "Warten 15 Min.", "sec": 900, "wait": true, "b": "Teig abgedeckt 15 Min. ruhen lassen. Währenddessen Kohl in feine Streifen (ca. 5 mm), Frühlingszwiebel in Ringe schneiden, Soße mischen."}, {"t": "Kohl unterheben", "d": "2 Min.", "sec": 120, "wait": false, "b": "Eier in den Teig, dann Kohl und Frühlingszwiebel locker unterheben. Nicht zu lange rühren, Luft soll drinbleiben."}, {"t": "Erste Seite", "d": "Warten 5 Min.", "sec": 300, "wait": true, "b": "Öl in der Pfanne, mittlere Hitze. Die Hälfte des Teigs zu einem 2 cm hohen Fladen formen, Schweinebauch obenauf legen. 5 Min. braten, bis die Unterseite goldbraun ist."}, {"t": "Wenden", "d": "Warten 5 Min.", "sec": 300, "wait": true, "b": "Mit zwei Pfannenwendern beherzt wenden (oder auf Teller gleiten lassen, Pfanne drüber, stürzen). Deckel drauf, 5 Min."}, {"t": "Fertig braten", "d": "2 Min.", "sec": 120, "wait": false, "b": "Nochmals wenden, Deckel ab, 2 Min. Zweiten Fladen genauso."}, {"t": "Toppings", "d": "1 Min.", "sec": 60, "wait": false, "b": "Soße aufstreichen, Mayo in dünnen Linien darüber, Bonito und Nori darauf."}], "notes": ["Fladen nach dem Wenden nicht flach drücken, sonst wird er kompakt.", "Typischer Fehler: zu hohe Hitze, außen schwarz, innen roh. Mittlere Hitze und Deckel.", "Vegetarisch: Schweinebauch weglassen, dafür Pilze oder Käse.", "Fertige Okonomiyaki-Soße aus dem Asia-Markt geht natürlich auch.", "Quellen: RecipeTin Japan (Okonomiyaki), YJC Tokyo (Soßen-Verhältnis), Sudachi (ohne Spezialmehl). Eigene Fassung."]}, {"id": "gyoza", "name": "Gyoza (Japanische Teigtaschen)", "cat": "Asiatisch", "yield": "30 Stück", "base": 30, "hydration": null, "scalable": true, "ing": [{"n": "Schweinehack", "a": 250.0, "u": "g", "p": "hackfleisch"}, {"n": "Weißkohl oder Chinakohl", "a": 200.0, "u": "g", "p": "weisskohl"}, {"n": "Salz (für den Kohl)", "a": 3.0, "u": "g", "p": "salz"}, {"n": "Frühlingszwiebeln", "a": 30.0, "u": "g", "p": "fruehlingszwiebel"}, {"n": "Ingwer, gerieben", "a": 8.0, "u": "g", "p": "ingwer"}, {"n": "Knoblauch, gerieben", "a": 6.0, "u": "g", "p": "knoblauch"}, {"n": "Sojasauce", "a": 15.0, "u": "g", "p": "sojasauce"}, {"n": "Sake (oder Wasser)", "a": 10.0, "u": "g", "p": "sake"}, {"n": "Sesamöl", "a": 8.0, "u": "g", "p": "sesamoel"}, {"n": "Speisestärke", "a": 5.0, "u": "g", "p": "staerke"}, {"n": "Gyoza-Teigblätter", "a": 30.0, "u": "Stk.", "p": "gyoza_teig"}, {"n": "Neutrales Öl", "a": 15.0, "u": "g", "p": "oel"}, {"n": "Wasser (zum Dämpfen)", "a": 80.0, "u": "g", "p": "wasser"}, {"n": "Reisessig (Dip)", "a": 20.0, "u": "g", "p": "reisessig"}, {"n": "Sojasauce (Dip)", "a": 20.0, "u": "g", "p": "sojasauce"}], "steps": [{"t": "Kohl salzen", "d": "3 Min.", "sec": 180, "wait": false, "b": "Kohl sehr fein hacken, mit 3 g Salz mischen."}, {"t": "Kohl ziehen lassen", "d": "Warten 10 Min.", "sec": 600, "wait": true, "b": "10 Min. Wasser ziehen lassen."}, {"t": "Füllung", "d": "5 Min.", "sec": 300, "wait": false, "b": "Kohl kräftig ausdrücken. Mit Hack, Frühlingszwiebel, Ingwer, Knoblauch, Soja, Sake, Sesamöl und Stärke 1 Min. verkneten, bis es klebt."}, {"t": "Falten", "d": "25 Min.", "sec": 1500, "wait": false, "b": "Je 1 TL Füllung auf ein Teigblatt, Rand mit Wasser befeuchten, zuklappen und eine Seite in 5 bis 6 Fältchen andrücken."}, {"t": "Anbraten", "d": "3 Min.", "sec": 180, "wait": false, "b": "Öl in einer beschichteten Pfanne, Gyoza dicht nebeneinander mit der flachen Seite nach unten, bei mittlerer Hitze braten, bis der Boden goldbraun ist."}, {"t": "Dämpfen", "d": "Warten 5 Min.", "sec": 300, "wait": true, "b": "80 g Wasser angießen, sofort Deckel drauf, 5 Min. dämpfen."}, {"t": "Knusprig ziehen", "d": "2 Min.", "sec": 120, "wait": false, "b": "Deckel ab, restliches Wasser verdampfen lassen, Schuss Öl an den Rand, bis der Boden wieder knusprig ist. Mit Essig-Soja-Dip servieren."}], "notes": ["Typischer Fehler: Kohl nicht ausgedrückt, dann wird die Füllung wässrig und die Taschen reißen.", "Roh auf einem bemehlten Blech einfrieren, dann in Beutel. Gefroren direkt braten, 2 Min. länger dämpfen.", "Vegetarisch: Tofu zerbröselt plus Shiitake statt Hack.", "Quellen: Just One Cookbook (Gyoza), RecipeTin Japan. Eigene Fassung."]}, {"id": "nikujaga", "name": "Nikujaga (Fleisch-Kartoffel-Schmortopf)", "cat": "Asiatisch", "yield": "3 Portionen", "base": 3, "hydration": null, "scalable": true, "ing": [{"n": "Rind, dünn geschnitten (oder Schweinenacken)", "a": 250.0, "u": "g", "p": "rind_kurz"}, {"n": "Kartoffeln (festkochend)", "a": 500.0, "u": "g", "p": "kartoffeln"}, {"n": "Zwiebel", "a": 200.0, "u": "g", "p": "zwiebel"}, {"n": "Karotte", "a": 100.0, "u": "g", "p": "karotten"}, {"n": "Neutrales Öl", "a": 10.0, "u": "g", "p": "oel"}, {"n": "Dashi oder Wasser", "a": 350.0, "u": "g", "p": "wasser"}, {"n": "Sojasauce (japanisch)", "a": 40.0, "u": "g", "p": "sojasauce"}, {"n": "Mirin", "a": 30.0, "u": "g", "p": "mirin"}, {"n": "Sake (oder Wasser)", "a": 30.0, "u": "g", "p": "sake"}, {"n": "Zucker", "a": 20.0, "u": "g", "p": "zucker"}, {"n": "Erbsen (TK, optional)", "a": 50.0, "u": "g", "p": "erbsen"}], "steps": [{"t": "Schnippeln", "d": "8 Min.", "sec": 480, "wait": false, "b": "Kartoffeln in große Stücke, Kanten leicht abrunden und 5 Min. wässern. Zwiebel in Spalten, Karotte schräg in Stücke, Fleisch in 5 cm Stücke."}, {"t": "Anbraten", "d": "4 Min.", "sec": 240, "wait": false, "b": "Öl im Topf, Fleisch kurz anbraten, bis es die Farbe verliert. Zwiebel, Kartoffeln und Karotte dazu, 1 Min. schwenken."}, {"t": "Würzen", "d": "2 Min.", "sec": 120, "wait": false, "b": "Dashi, Sake, Mirin und Zucker angießen, aufkochen, Schaum abschöpfen."}, {"t": "Schmoren mit Deckel", "d": "Warten 10 Min.", "sec": 600, "wait": true, "b": "Einen Bogen Backpapier direkt auf die Oberfläche legen (Otoshibuta), bei mittlerer bis kleiner Hitze 10 Min. köcheln."}, {"t": "Soja dazu", "d": "Warten 10 Min.", "sec": 600, "wait": true, "b": "Sojasauce zugeben, Backpapier wieder auflegen, weitere 10 Min. köcheln, bis die Kartoffeln weich sind."}, {"t": "Ziehen lassen", "d": "Warten 10 Min.", "sec": 600, "wait": true, "b": "Vom Herd nehmen und 10 Min. ruhen lassen, die Kartoffeln saugen die Würze auf. Erbsen kurz erwärmen und darüberstreuen. Mit Reis servieren."}], "notes": ["Sojasauce erst nach dem Zucker: so zieht die Süße zuerst ein, klassische Reihenfolge.", "Typischer Fehler: zu stark umrühren, Kartoffeln zerfallen. Lieber den Topf schwenken.", "Schmeckt am nächsten Tag noch besser.", "Quellen: Just One Cookbook (Nikujaga), RecipeTin Japan, America's Test Kitchen. Eigene Fassung."]}, {"id": "buta-no-shogayaki", "name": "Buta no Shogayaki (Ingwer-Schwein)", "cat": "Asiatisch", "yield": "2 Portionen", "base": 2, "hydration": null, "scalable": true, "ing": [{"n": "Schweinenacken oder -lachs, dünne Scheiben (3 mm)", "a": 300.0, "u": "g", "p": "schwein_stueck"}, {"n": "Mehl (zum Bestäuben)", "a": 10.0, "u": "g", "p": "mehl"}, {"n": "Zwiebel", "a": 100.0, "u": "g", "p": "zwiebel"}, {"n": "Neutrales Öl", "a": 10.0, "u": "g", "p": "oel"}, {"n": "Ingwer, frisch gerieben", "a": 15.0, "u": "g", "p": "ingwer"}, {"n": "Sojasauce (japanisch)", "a": 30.0, "u": "g", "p": "sojasauce"}, {"n": "Mirin", "a": 20.0, "u": "g", "p": "mirin"}, {"n": "Sake (oder Wasser)", "a": 20.0, "u": "g", "p": "sake"}, {"n": "Zucker", "a": 5.0, "u": "g", "p": "zucker"}, {"n": "Weißkohl, fein gehobelt", "a": 120.0, "u": "g", "p": "weisskohl"}], "steps": [{"t": "Reis aufsetzen", "d": "3 Min.", "sec": 180, "wait": false, "b": "Dazu Reis: 200 g Sushi-Reis waschen, mit 260 g Wasser 12 Min. kochen, 10 Min. ziehen lassen (siehe Onigiri Grundrezept)."}, {"t": "Soße", "d": "2 Min.", "sec": 120, "wait": false, "b": "Ingwer, Sojasauce, Mirin, Sake und Zucker verrühren. Zwiebel in Streifen schneiden."}, {"t": "Fleisch bestäuben", "d": "2 Min.", "sec": 120, "wait": false, "b": "Scheiben dünn mit Mehl bestäuben, überschüssiges abklopfen. Das bindet später die Soße."}, {"t": "Braten", "d": "4 Min.", "sec": 240, "wait": false, "b": "Öl in großer Pfanne, hohe Hitze. Fleisch ausgebreitet braten, bis es Farbe hat, wenden. Zwiebel dazu, 1 Min."}, {"t": "Glasieren", "d": "2 Min.", "sec": 120, "wait": false, "b": "Soße angießen, 1 bis 2 Min. schwenken, bis sie glänzt und am Fleisch haftet. Mit Kohl und Reis servieren."}], "notes": ["Frischen Ingwer nehmen, Pulver schmeckt flach.", "Typischer Fehler: Pfanne zu voll, dann kocht das Fleisch statt zu braten. Lieber in 2 Runden.", "Nach Wunsch 1 EL Ingwer erst am Ende dazu, dann schärfer und frischer.", "Quellen: Just One Cookbook (Ginger Pork), RecipeTin Japan. Eigene Fassung."]}, {"id": "tom-kha-gai", "name": "Tom Kha Gai (Thai-Kokos-Hühnersuppe)", "cat": "Asia-Suppen", "yield": "2 Portionen", "base": 2, "hydration": null, "scalable": true, "ing": [{"n": "Kokosmilch", "a": 400.0, "u": "g", "p": "kokosmilch"}, {"n": "Hühnerbrühe", "a": 250.0, "u": "g", "p": "bruehe"}, {"n": "Hähnchenschenkel oder -brust", "a": 250.0, "u": "g", "p": "haehnchen"}, {"n": "Galgant (frisch oder TK)", "a": 30.0, "u": "g", "p": "galgant"}, {"n": "Zitronengras", "a": 2.0, "u": "Stk.", "p": "zitronengras"}, {"n": "Kaffirlimettenblätter", "a": 4.0, "u": "Stk.", "p": "gewuerz"}, {"n": "Thai-Chilis", "a": 2.0, "u": "Stk.", "p": "chili"}, {"n": "Champignons oder Austernpilze", "a": 120.0, "u": "g", "p": "pilze"}, {"n": "Fischsauce", "a": 20.0, "u": "g", "p": "fischsauce"}, {"n": "Zucker (am besten Palmzucker)", "a": 5.0, "u": "g", "p": "zucker"}, {"n": "Limettensaft", "a": 25.0, "u": "g", "p": "limette"}, {"n": "Koriander (frisch)", "a": 5.0, "u": "g", "p": "koriander"}], "steps": [{"t": "Vorbereiten", "d": "5 Min.", "sec": 300, "wait": false, "b": "Galgant in dünne Scheiben, Zitronengras in 4 cm Stücke schneiden und mit dem Messerrücken anklopfen. Kaffirblätter einreißen, Chilis andrücken. Hähnchen in dünne Streifen, Pilze in mundgerechte Stücke."}, {"t": "Aromen ziehen lassen", "d": "Warten 5 Min.", "sec": 300, "wait": true, "b": "Brühe und die Hälfte der Kokosmilch mit Galgant, Zitronengras und Kaffirblättern aufkochen, dann leise simmern lassen."}, {"t": "Hähnchen und Pilze", "d": "6 Min.", "sec": 360, "wait": false, "b": "Hähnchen und Pilze zugeben und leise simmern, bis das Fleisch gar ist. Nicht sprudelnd kochen, sonst flockt die Kokosmilch aus."}, {"t": "Würzen", "d": "2 Min.", "sec": 120, "wait": false, "b": "Restliche Kokosmilch, Fischsauce und Zucker einrühren, nur noch heiß werden lassen."}, {"t": "Abschmecken", "d": "1 Min.", "sec": 60, "wait": false, "b": "Herd aus. Limettensaft und Chilis zugeben, mit Koriander servieren. Abschmecken: Sie soll salzig, sauer und leicht süß zugleich sein."}], "notes": ["Galgant ist das Herz der Suppe, Ingwer schmeckt deutlich anders. Galgant, Zitronengras und Kaffirblätter gibt es im Asia-Markt oft tiefgekühlt.", "Die harten Kräuter bleiben in der Suppe, werden aber nicht mitgegessen.", "Limettensaft erst ganz am Ende und nicht mitkochen, sonst wird er bitter.", "Dazu Jasminreis. In Thailand wird sie als Hauptgericht gegessen."]}, {"id": "tom-yum-goong", "name": "Tom Yum Goong (Scharf-saure Garnelensuppe)", "cat": "Asia-Suppen", "yield": "2 Portionen", "base": 2, "hydration": null, "scalable": true, "ing": [{"n": "Garnelen, roh, geschält (Schalen aufheben)", "a": 250.0, "u": "g", "p": "garnelen"}, {"n": "Hühnerbrühe oder Wasser", "a": 700.0, "u": "g", "p": "wasser"}, {"n": "Zitronengras", "a": 2.0, "u": "Stk.", "p": "zitronengras"}, {"n": "Galgant (frisch oder TK)", "a": 20.0, "u": "g", "p": "galgant"}, {"n": "Kaffirlimettenblätter", "a": 5.0, "u": "Stk.", "p": "gewuerz"}, {"n": "Thai-Chilis", "a": 3.0, "u": "Stk.", "p": "chili"}, {"n": "Austernpilze oder Champignons", "a": 120.0, "u": "g", "p": "pilze"}, {"n": "Tomate (optional)", "a": 100.0, "u": "g", "p": "tomaten"}, {"n": "Nam Prik Pao (thailändische Chilipaste in Öl)", "a": 20.0, "u": "g", "p": "nam_prik_pao"}, {"n": "Fischsauce", "a": 25.0, "u": "g", "p": "fischsauce"}, {"n": "Zucker", "a": 3.0, "u": "g", "p": "zucker"}, {"n": "Limettensaft", "a": 35.0, "u": "g", "p": "limette"}, {"n": "Koriander (frisch)", "a": 5.0, "u": "g", "p": "koriander"}, {"n": "Kondensmilch, ungezuckert (optional, für die cremige Variante)", "a": 40.0, "u": "g", "p": "kondensmilch"}], "steps": [{"t": "Vorbereiten", "d": "5 Min.", "sec": 300, "wait": false, "b": "Zitronengras in Stücke schneiden und anklopfen, Galgant in Scheiben, Kaffirblätter einreißen, Chilis andrücken. Pilze zerteilen, Tomate achteln. Garnelen am Rücken einschneiden und den Darm entfernen."}, {"t": "Brühe", "d": "Warten 8 Min.", "sec": 480, "wait": true, "b": "Brühe mit Garnelenschalen, Zitronengras, Galgant und Kaffirblättern aufkochen und leise ziehen lassen. Schalen danach mit einem Schaumlöffel herausheben."}, {"t": "Pilze und Tomate", "d": "3 Min.", "sec": 180, "wait": false, "b": "Pilze und Tomate zugeben und 2–3 Min. köcheln."}, {"t": "Würzen", "d": "1 Min.", "sec": 60, "wait": false, "b": "Nam Prik Pao, Fischsauce und Zucker einrühren."}, {"t": "Garnelen", "d": "2 Min.", "sec": 120, "wait": false, "b": "Garnelen zugeben und nur 1–2 Min. ziehen lassen, bis sie rosa sind. Sonst werden sie zäh. Für die cremige Variante jetzt die Kondensmilch einrühren."}, {"t": "Abschmecken", "d": "1 Min.", "sec": 60, "wait": false, "b": "Herd aus. Limettensaft und Chilis einrühren, mit Koriander servieren. Sie soll deutlich sauer und scharf sein."}], "notes": ["Zwei Varianten: Nam Sai ist klar, Nam Khon ist cremig mit Kondensmilch. Beide sind original.", "Die Garnelenschalen geben der Brühe den Geschmack. Nicht wegwerfen.", "Ohne Nam Prik Pao wird die Suppe heller und weniger rund. Ersatz: 5 g Zucker mehr und 1 TL Chiliöl.", "Mit Hähnchen statt Garnelen heißt sie Tom Yum Gai. Das Fleisch dann 5 Min. garen."]}, {"id": "miso-suppe", "name": "Miso-Suppe mit Tofu und Wakame", "cat": "Asia-Suppen", "yield": "4 Schalen (à 200 ml)", "base": 4, "hydration": null, "scalable": true, "ing": [{"n": "Wasser", "a": 900.0, "u": "g", "p": "wasser"}, {"n": "Kombu (getrocknet)", "a": 10.0, "u": "g", "p": "kombu"}, {"n": "Bonitoflocken (Katsuobushi)", "a": 15.0, "u": "g", "p": "bonito"}, {"n": "Miso (hell oder gemischt)", "a": 70.0, "u": "g", "p": "miso"}, {"n": "Seidentofu", "a": 200.0, "u": "g", "p": "tofu"}, {"n": "Wakame (getrocknet)", "a": 3.0, "u": "g", "p": "wakame"}, {"n": "Frühlingszwiebel", "a": 15.0, "u": "g", "p": "fruehlingszwiebel"}], "steps": [{"t": "Dashi ansetzen", "d": "Warten 8 Min.", "sec": 480, "wait": true, "b": "Kombu in das kalte Wasser legen und langsam erhitzen. Kurz bevor es kocht, Kombu herausnehmen. Parallel Wakame in kaltem Wasser einweichen."}, {"t": "Bonito", "d": "3 Min.", "sec": 180, "wait": false, "b": "Bonitoflocken ins heiße Wasser geben, 1 Min. leise köcheln, dann 2 Min. ziehen lassen, bis sie absinken. Durch ein feines Sieb abgießen. Ergibt ca. 800 g Dashi."}, {"t": "Einlagen", "d": "2 Min.", "sec": 120, "wait": false, "b": "Dashi zurück in den Topf. Tofu in 1,5 cm Würfel schneiden, mit der abgetropften Wakame zugeben und nur warm werden lassen."}, {"t": "Miso", "d": "2 Min.", "sec": 120, "wait": false, "b": "Herd aus. Miso in einer Kelle mit etwas Dashi glatt rühren und einrühren. Ab jetzt nicht mehr kochen."}, {"t": "Servieren", "d": "1 Min.", "sec": 60, "wait": false, "b": "In Schalen füllen, Frühlingszwiebel in feinen Ringen darüber."}], "notes": ["Faustregel aus Japan: 1 EL (ca. 18 g) Miso pro Schale mit 200 ml. Bei neuer Miso-Sorte mit weniger starten und nachwürzen.", "Miso nie kochen lassen, sonst verliert es Aroma.", "Abkürzung: statt Kombu und Bonito 8 g Instant-Dashi (z. B. Hondashi) in 800 g heißem Wasser auflösen.", "Der Kombu kann für die Shiitake-Kombu-Füllung bei den Onigiri weiterverwendet werden."]}, {"id": "egg-drop-soup", "name": "Egg Drop Soup (Chinesische Eierblumensuppe)", "cat": "Asia-Suppen", "yield": "4 Portionen", "base": 4, "hydration": null, "scalable": true, "ing": [{"n": "Hühnerbrühe", "a": 1000.0, "u": "g", "p": "bruehe"}, {"n": "Ingwer (in Scheiben, optional)", "a": 5.0, "u": "g", "p": "ingwer"}, {"n": "Speisestärke", "a": 20.0, "u": "g", "p": "staerke"}, {"n": "Wasser (für die Stärke)", "a": 40.0, "u": "g", "p": "wasser"}, {"n": "Eier (Größe L)", "a": 3.0, "u": "Stk.", "p": "eier"}, {"n": "Sesamöl", "a": 5.0, "u": "g", "p": "sesamoel"}, {"n": "Zucker", "a": 2.0, "u": "g", "p": "zucker"}, {"n": "Salz (je nach Brühe)", "a": 2.0, "u": "g", "p": "salz"}, {"n": "Weißer Pfeffer", "a": 1.0, "u": "g", "p": "pfeffer"}, {"n": "Frühlingszwiebeln", "a": 20.0, "u": "g", "p": "fruehlingszwiebel"}], "steps": [{"t": "Brühe", "d": "Warten 5 Min.", "sec": 300, "wait": true, "b": "Brühe mit den Ingwerscheiben aufkochen und 5 Min. leise ziehen lassen. Ingwer herausnehmen."}, {"t": "Würzen", "d": "1 Min.", "sec": 60, "wait": false, "b": "Sesamöl, Zucker, Salz und weißen Pfeffer einrühren. Eier in einer Schüssel mit einer Gabel gut verquirlen."}, {"t": "Binden", "d": "2 Min.", "sec": 120, "wait": false, "b": "Stärke mit dem kalten Wasser glatt rühren, unter Rühren in die köchelnde Brühe gießen, 1 Min. köcheln, bis sie leicht sämig ist."}, {"t": "Eier", "d": "1 Min.", "sec": 60, "wait": false, "b": "Hitze auf leises Simmern. Brühe mit einem Löffel langsam im Kreis rühren und die Eier in dünnem Strahl (z. B. über eine Gabel) einlaufen lassen. 10 Sek. ruhen lassen, dann einmal vorsichtig umrühren."}, {"t": "Servieren", "d": "1 Min.", "sec": 60, "wait": false, "b": "Mit Frühlingszwiebelringen servieren."}], "notes": ["Feine Eierfäden: Brühe darf nur simmern, das Ei muss langsam und dünn einlaufen.", "Erst Stärke, dann Ei: In gebundener Brühe bleiben die Fäden zart und verteilen sich.", "Varianten: Tomatenwürfel oder Mais mitkochen, oder ein paar Tofuwürfel.", "Die Brühe macht den Geschmack. Mit guter Hühnerbrühe wird sie deutlich besser."]}, {"id": "kimchi-jjigae", "name": "Kimchi-Jjigae (Koreanischer Kimchi-Eintopf)", "cat": "Asia-Suppen", "yield": "2 Portionen", "base": 2, "hydration": null, "scalable": true, "ing": [{"n": "Kimchi, gut gereift (sauer)", "a": 250.0, "u": "g", "p": "kimchi"}, {"n": "Kimchi-Saft (aus dem Glas)", "a": 50.0, "u": "g", " ngt Süße und Würze.", "Aufgewärmt am nächsten Tag noch besser."]}, {"id": "tiramisu", "name": "Tiramisu (klassisch)", "cat": "Desserts", "yield": "8 Portionen (Form ca. 20 × 30 cm)", "base": 8, "hydration": null, "scalable": true, "ing": [{"n": "Espresso, stark", "a": 300.0, "u": "g", "p": "kaffee"}, {"n": "Marsala oder Amaretto (optional)", "a": 40.0, "u": "g", "p": "likoer"}, {"n": "Eier (Größe L, sehr frisch)", "a": 4.0, "u": "Stk.", "p": "eier"}, {"n": "Zucker", "a": 100.0, "u": "g", "p": "zucker"}, {"n": "Salz", "a": 0.5, "u": "g", "p": "salz"}, {"n": "Mascarpone (kalt)", "a": 500.0, "u": "g", "p": "mascarpone"}, {"n": "Löffelbiskuits (Savoiardi)", "a": 300.0, "u": "g", "p": "loeffelbiskuits"}, {"n": "Kakaopulver, ungesüßt", "a": 15.0, "u": "g", "p": "kakao"}], "steps": [{"t": "Espresso", "d": "Warten 15 Min.", "sec": 900, "wait": true, "b": "Espresso kochen, mit dem Likör mischen und in einer flachen Schale vollständig abkühlen lassen."}, {"t": "Eigelb aufschlagen", "d": "5 Min.", "sec": 300, "wait": false, "b": "Eier trennen. Eigelb mit der Hälfte des Zuckers 4–5 Min. hell und dickcremig aufschlagen."}, {"t": "Mascarpone", "d": "2 Min.", "sec": 120, "wait": false, "b": "Kalten Mascarpone kurz auf niedriger Stufe unterrühren, nur bis die Creme glatt ist. Zu langes Rühren macht sie flüssig."}, {"t": "Eischnee", "d": "4 Min.", "sec": 240, "wait": false, "b": "Eiweiß mit Salz anschlagen, restlichen Zucker einrieseln lassen und zu festem, glänzendem Schnee schlagen."}, {"t": "Unterheben", "d": "3 Min.", "sec": 180, "wait": false, "b": "Ein Drittel des Schnees unterrühren, den Rest mit dem Teigschaber locker unterheben."}, {"t": "Schichten", "d": "10 Min.", "sec": 600, "wait": false, "b": "Biskuits einzeln nur 1 Sek. pro Seite in den Espresso tauchen und dicht in die Form legen. Hälfte der Creme darauf, glatt streichen. Zweite Lage Biskuits, restliche Creme."}, {"t": "Kühlen", "d": "Warten 6 h", "sec": 21600, "wait": true, "b": "Abgedeckt mindestens 6 h, besser über Nacht, in den Kühlschrank stellen."}, {"t": "Kakao", "d": "1 Min.", "sec": 60, "wait": false, "b": "Kurz vor dem Servieren dick mit Kakao durch ein Sieb bestäuben."}], "notes": ["Biskuits nur kurz eintauchen: Sie ziehen in der Creme nach. Zu nass wird das Tiramisu matschig.", "Rohe Eier: nur sehr frische Eier, nicht für Schwangere und Kleinkinder. Hält 2 Tage im Kühlschrank.", "Ohne Alkohol: Likör weglassen, Geschmack bleibt klassisch.", "Kakao erst zum Schluss, sonst wird er feucht und fleckig."]}, {"id": "mousse-au-chocolat", "name": "Mousse au Chocolat", "cat": "Desserts", "yield": "6 Portionen", "base": 6, "hydration": null, "ing": [{"n": "Zartbitterschokolade (60–70 %)", "a": 200.0, "u": "g", "p": "schokolade"}, {"n": "Butter", "a": 30.0, "u": "g", "p": "butter"}, {"n": "Eier (Größe L, sehr frisch)", "a": 4.0, "u": "Stk.", "p": "eier"}, {"n": "Zucker", "a": 40.0, "u": "g", "p": "zucker"}, {"n": "Sahne (kalt)", "a": 200.0, "u": "g", "p": "sahne"}, {"n": "Salz", "a": 1.0, "u": "g", "p": "salz"}, {"n": "Espresso (optional)", "a": 20.0, "u": "g", "p": "kaffee"}], "steps": [{"t": "Schmelzen", "d": "5 Min.", "sec": 300, "wait": false, "b": "Schokolade und Butter über dem Wasserbad schmelzen. Auf ca. 35 °C abkühlen lassen."}, {"t": "Eigelb", "d": "3 Min.", "sec": 180, "wait": false, "b": "Eier trennen. Eigelb mit 20 g Zucker hell aufschlagen und unter die Schokolade rühren. Optional Espresso dazu."}, {"t": "Sahne", "d": "3 Min.", "sec": 180, "wait": false, "b": "Sahne halbsteif schlagen, sie soll noch weich fallen."}, {"t": "Eischnee", "d": "4 Min.", "sec": 240, "wait": false, "b": "Eiweiß mit Salz anschlagen, restlichen Zucker einrieseln lassen. Glänzend, mit weichen Spitzen."}, {"t": "Unterheben", "d": "3 Min.", "sec": 180, "wait": false, "b": "Erst die Sahne, dann den Eischnee in drei Portionen locker unterheben. Nicht rühren."}, {"t": "Kühlen", "d": "Warten 4 h", "sec": 14400, "wait": true, "b": "In Gläser oder eine Schüssel füllen, abgedeckt mindestens 4 h kalt /* ---------- helpers ---------- */
function fmtNum(v){
  if (v >= 10) return String(Math.round(v));
  const x = Math.round(v * 10) / 10;
  return String(x).replace(".", ",");
}
function fmtAmt(a, u){
  if (u === "Stk.") return Math.max(1, Math.round(a)) + " Stk.";
  if (u === "g" && a >= 1000) return (Math.round(a / 10) / 100).toString().replace(".", ",") + " kg";
  return fmtNum(a) + (u ? " " + u : "");
}
function fmtDur(sec){
  if (!sec) return "";
  if (sec >= 86400) { const d = Math.round(sec / 86400); return d + (d === 1 ? " Tag" : " Tage"); }
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  if (h && m) return h + " h " + m + " Min.";
  if (h) return h + " h";
  return m + " Min.";
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const p = n => String(n).padStart(2, "0");
  if (d) return d + "d " + p(h) + ":" + p(m) + ":" + p(s);
  if (h) return h + ":" + p(m) + ":" + p(s);
  return p(m) + ":" + p(s);
}
function times(r){

  return `<div class="bdg">${c ? `<span class="bc" aria-label="${c}-mal gekocht">🍳 ${c}×</span>` : ""}${a ? `<span class="ba" aria-label="Durchschnitt ${fmtAvg(a.avg)} Sterne">★ ${fmtAvg(a.avg)}</span>` : ""}</div>`;
}
