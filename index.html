/* ---------- Bilder (Titelbild optional über r.img, sonst Emoji auf Farbfläche) ---------- */
const TINTS = ["#F3E1D6","#E7EBD9","#F1E6CB","#E1E8EE","#F1DCD7","#EAE2F0","#E3EEE6"];
function tint(cat){ const i = Math.max(0, DATA.cats.indexOf(cat)); return TINTS[i % TINTS.length]; }
function pic(r, cls, extra){ const u = photoOf(r); return `<div class="pic ${cls || ""}" style="--tint:${tint(r.cat)}">${u ? `<img src="${esc(u)}" alt="" loading="lazy">` : `<span class="pe" aria-hidden="true">${emo(r)}</span>`}${extra || ""}${cls === "r-pic" ? "" : badges(r.id)}</div>`; }
function catPic(c){ const r0 = RECIPES.find(r => r.cat === c && photoOf(r)); return `<div class="pic" style="--tint:${tint(c)}">${r0 ? `<img src="${esc(photoOf(r0))}" alt="" loading="lazy">` : `<span class="pe" aria-hidden="true">${CAT_EMOJI[c] || "🍽️"}</span>`}</div>`; }
if (!Array.isArray(S.recent)) S.recent = [];
function pushRecent(id){ S.recent = [id, ...S.recent.filter(x => x !== id)].slice(0, 10); save(); }
function dailyPicks(n){
  const d = new Date(), seed = d.getFullYear() * 400 + d.getMonth() * 32 + d.getDate();
  const pool = RECIPES.filter(r => r.cat !== "Grundlagen" && r.cat !== "Dressings");
  const out = []; let x = seed;
  while (out.length < Math.min(n, pool.length)) { x = (x * 9301 + 49297) % 233280; const r = pool[x % pool.length]; if (!out.includes(r)) out.push(r); }
  return out;
}

/* ---------- Eigene Fotos (IndexedDB, nur auf diesem Gerät) ---------- */
const PH = {db: null, urls: {}, mem: false};
function phOpen(){
  return new Promise(res => {
    try {
      const rq = indexedDB.open("rk-fotos", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("fotos");
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => res(null);
      rq.onblocked = () => res(null);
    } catch (e) { res(null); }
  });
}
function phTx(mode, fn){
  return new Promise((res, rej) => {
    if (!PH.db) return rej(new Error("kein Speicher"));
    try { const tx = PH.db.transaction("fotos", mode), st = tx.objectStore("fotos"); const out = fn(st); tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }
    catch (e) { rej(e); }
  });
}
async function phInit(){
  PH.db = await phOpen();
  if (!PH.db) { PH.mem = true; return; }
  try {
    const keys = await new Promise((res, rej) => { const tx = PH.db.transaction("fotos"), rq = tx.objectStore("fotos").getAllKeys(); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
    for (const k of keys) {
      const blob = await new Promise((res, rej) => { const rq = PH.db.transaction("fotos").objectStore("fotos").get(k); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
      if (blob) PH.urls[k] = URL.createObjectURL(blob);
    }
  } catch (e) { PH.mem = true; }
  if (Object.keys(PH.urls).length) route();
}
function photoOf(r){ return PH.urls[r.id] || r.img || ""; }
function shrink(file, max){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("Bild nicht lesbar")), "image/jpeg", .82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Bild nicht lesbar")); };
    img.src = url;
  });
}
function pickPhoto(){ const f = document.getElementById("ph-file"); f.value = ""; f.click(); }
document.getElementById("ph-file").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0], r = curR;
  if (!file || !r) return;
  const box = document.querySelector("#r-body .r-pic");
  if (box) box.insertAdjacentHTML("beforeend", `<div class="ph-busy">Foto wird gespeichert …</div>`);
  try {
    const blob = await shrink(file, 1400);
    let saved = false;
    try { await phTx("readwrite", st => st.put(blob, r.id)); saved = true; } catch (err) {}
    if (PH.urls[r.id]) URL.revokeObjectURL(PH.urls[r.id]);
    PH.urls[r.id] = URL.createObjectURL(blob);
    const y = window.scrollY; renderRecipe(r); window.scrollTo(0, y);
    toast(saved ? "📷 Foto gespeichert" : "📷 Foto nur bis zum Schließen der App gespeichert");
  } catch (err) {
    const b = document.querySelector("#r-body .ph-busy"); if (b) b.remove();
    toast("Foto konnte nicht gelesen werden");
  }
});
function delPhoto(){
  const r = curR; if (!r || !PH.urls[r.id]) return;
  ask("Dein Foto von „" + r.name + "“ entfernen?", async () => {
    try { await phTx("readwrite", st => st.delete(r.id)); } catch (e) {}
    URL.revokeObjectURL(PH.urls[r.id]); delete PH.urls[r.id];
    const y = window.scrollY; renderRecipe(r); window.scrollTo(0, y); toast("Foto entfernt");
  });
}

/* ---------- routing (hash) ---------- */
let listState = {cat: null, q: "", mode: "alle"};
let lastList = "kochbuch";
function go(h){ if (location.hash === "#" + h) route(); else location.hash = h; }
function show(v){
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("active", x.id === "v-" + v));
  document.body.classList.toggle("no-tabs", v === "rezept" || v === "kochen");
  document.body.classList.toggle("v-rezept", v === "rezept");
  const h = location.hash.slice(1) || "home";
  const cur = v === "home" ? "home" : v === "kuehl" ? "kuehlschrank" : v === "einkauf" ? "einkauf" : (v === "liste" && h !== "favoriten") ? "kochbuch" : "";
  document.querySelectorAll(".tab").forEach(t => { const on = t.dataset.tab === cur; t.classList.toggle("on", on); if (on) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current"); });
  window.scrollTo(0, 0);
}
function route(){
  const h = location.hash.slice(1) || "home";
  if (h === "home") { renderHome(); show("home"); return; }
  if (h === "kochbuch" || h === "favoriten" || h.startsWith("kat-")) {
    lastList = h;
    listState.mode = h === "favoriten" ? "fav" : "alle";
    listState.cat = h.startsWith("kat-") ? DATA.cats.find(c => slug(c) === h.slice(4)) || null : null;
    renderList(); show("liste"); return;
  }
  if (h === "einkauf") { renderShop(); show("einkauf"); return; }
  if (h === "kuehlschrank") { lastList = h; renderFridge(); show("kuehl"); return; }
  if (h.startsWith("r-") && BY_ID[h.slice(2)]) { stopCookIfOther(h.slice(2)); renderRecipe(BY_ID[h.slice(2)]); show("rezept"); return; }
  if (h.startsWith("koch-") && BY_ID[h.slice(5)]) { startCook(BY_ID[h.slice(5)]); show("kochen"); return; }
  go("home");
}
function slug(t){ return t.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }

/* ---------- cooking + timers ---------- */
let cook = {r: null, i: 0};
let timers = []; // {key, label, end, paused, left, done}
let wakeLock = null;
function startCook(r){
  if (!cook.r || cook.r.id !== r.id) { cook = {r, i: 0}; }
  document.getElementById("k-title").textContent = r.name;
  const f = factor(r);
  document.getElementById("k-fr").innerHTML = fridgeBanner(r);
  document.getElementById("k-ing").innerHTML = r.ing.length ? r.ing.map(i => `<div class="ing"><span>${esc(i.n)}${ingMark(r, i)}</span><span class="a">${fmtAmt(i.a * f, i.u)}</span></div>`).join("") : `<div class="empty">Keine Zutaten</div>`;
  renderCook();
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => wakeLock = w).catch(() => {}); } catch(e) {}
}
function stopCookIfOther(id){ if (cook.r && cook.r.id !== id && !timers.some(t => !t.done)) cook = {r: null, i: 0}; }
function tKey(i){ return cook.r.id + ":" + i; }
function renderCook(){
  const r = cook.r, s = r.steps[cook.i], n = r.steps.length;
  document.getElementById("k-segs").innerHTML = r.steps.map((_, j) => `<i class="${j <= cook.i ? "on" : ""}"></i>`).join("");
  document.getElementById("k-lbl").textContent = s.wait ? "⏳ Wartezeit" : "👐 Arbeitsschritt";
  document.getElementById("k-cnt").textContent = (cook.i + 1) + " / " + n;
  let h = `<div class="cook-card"><div class="k">Schritt ${cook.i + 1}${s.sec ? " · " + fmtDur(s.sec) : ""}</div><h3>${esc(s.t)}</h3><p>${esc(s.b)}</p></div>`;
  if (s.sec) {
    const t = timers.find(x => x.key === tKey(cook.i));
    const left = t ? tLeft(t) : s.sec;
    const runningNow = t && !t.paused && !t.done;
    h += `<div class="tbox"><div class="l">${s.wait ? "Wartezeit" : "Timer"}</div>${ringHtml(left, s.sec, runningNow)}
      <div class="row">${t ? `<button class="btn ${runningNow ? "btn-s" : "btn-p"}" onclick="toggleT()">${runningNow ? "⏸ Pause" : t.done ? "✓ Fertig" : "▶ Weiter"}</button><button class="btn btn-s" onclick="resetT()">↺ Neu</button>`
      : `<button class="btn btn-p" onclick="toggleT()">▶ Timer starten</button>`}</div></div>`;
  }
  document.getElementById("k-step").innerHTML = h;
  document.getElementById("k-nav").innerHTML =
    (cook.i > 0 ? `<button class="btn btn-s" onclick="stepGo(-1)">← Zurück</button>` : `<span></span>`) +
    (cook.i < n - 1 ? `<button class="btn btn-p" onclick="stepGo(1)">Weiter →</button>` : `<button class="btn btn-p" onclick="finishCook()">✓ Fertig</button>`);
  renderRunning();
}

const RING_C = 2 * Math.PI * 92;
function ringHtml(left, total, on){
  const frac = total ? Math.max(0, Math.min(1, left / total)) : 0;
  return `<div class="ring"><svg viewBox="0 0 210 210" width="210" height="210" aria-hidden="true"><circle cx="105" cy="105" r="92" fill="none" stroke="var(--surface-3)" stroke-width="12"/>` +
    `<circle id="k-ring" cx="105" cy="105" r="92" fill="none" stroke="${on ? "var(--wait)" : "var(--accent)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${RING_C.toFixed(1)}" stroke-dashoffset="${(RING_C * (1 - frac)).toFixed(1)}"/></svg>` +
    `<div class="rv2"><b class="${on ? "on" : ""}" id="k-tv" role="timer">${fmtClock(left)}</b><small>von ${fmtClock(total)}</small></div></div>`;
}
function ringSet(left, total){ const c = document.getElementById("k-ring"); if (c && total) c.setAttribute("stroke-dashoffset", (RING_C * (1 - Math.max(0, Math.min(1, left / total)))).toFixed(1)); }
function stepGo(d){ cook.i += d; renderCook(); window.scrollTo(0, 0); }
function tLeft(t){ return t.done ? 0 : t.paused ? t.left : (t.end - Date.now()) / 1000; }
function toggleT(){
  const key = tKey(cook.i), s = cook.r.steps[cook.i];
  let t = timers.find(x => x.key === key);
  if (!t) { timers.push({key, label: cook.r.name.split(" (")[0] + ": " + s.t, end: Date.now() + s.sec * 1000, paused: false, left: s.sec, done: false, step: cook.i}); beep(true); }
  else if (t.done) { return; }
  else if (t.paused) { t.end = Date.now() + t.left * 1000; t.paused = false; }
  else { t.left = tLeft(t); t.paused = true; }
  renderCook();
}
function resetT(){ timers = timers.filter(x => x.key !== tKey(cook.i)); renderCook(); }
function renderRunning(){
  const el = document.getElementById("k-running");
  const others = timers.filter(t => !(cook.r && t.key === tKey(cook.i)));
  el.innerHTML = others.map(t => `<div class="run ${t.done ? "done" : ""}" data-k="${esc(t.key)}"><span>${t.done ? "⏰" : "⏳"}</span><span class="rt">${esc(t.label)}</span><span class="rv">${t.done ? "Fertig!" : fmtClock(tLeft(t))}</span><button aria-label="Timer entfernen" data-x="${esc(t.key)}">×</button></div>`).join("");
  el.querySelectorAll("[data-x]").forEach(b => b.onclick = e => { e.stopPropagation(); timers = timers.filter(t => t.key !== b.dataset.x); renderRunning(); });
  el.querySelectorAll(".run").forEach(d => d.onclick = () => { const t = timers.find(x => x.key === d.dataset.k); if (t && cook.r && t.key.startsWith(cook.r.id + ":")) { cook.i = t.step; renderCook(); } });
}
let audioCtx = null;
function beep(unlockOnly){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (unlockOnly) { audioCtx.resume(); return; }
    [0, .35, .7].forEach(o => { const os = audioCtx.createOscillator(), g = audioCtx.createGain(); os.frequency.value = 880; os.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.25, audioCtx.currentTime + o); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + o + .3); os.start(audioCtx.currentTime + o); os.stop(audioCtx.currentTime + o + .3); });
  } catch(e) {}
}
setInterval(() => {
  let fired = false;
  timers.forEach(t => { if (!t.done && !t.paused && t.end <= Date.now()) { t.done = true; fired = t; } });
  if (fired) { beep(); try { navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 400]); } catch(e) {} toast("⏰ Zeit um: " + fired.label); }
  if (document.getElementById("v-kochen").classList.contains("active")) {
    const cur = cook.r && timers.find(x => x.key === tKey(cook.i));
    if (fired && cur === fired) renderCook();
    else { const tv = document.getElementById("k-tv"); if (tv && cur) { tv.textContent = fmtClock(tLeft(cur)); ringSet(tLeft(cur), cook.r.steps[cook.i].sec); } renderRunning(); }
  }
}, 1000);
function leaveCook(){
  const running = timers.filter(t => !t.done).length;
  const back = () => { try { wakeLock && wakeLock.release(); } catch(e) {} go("r-" + cook.r.id); };
  if (running) ask(running + (running === 1 ? " Timer läuft" : " Timer laufen") + " noch. Kochen trotzdem verlassen? Die Timer laufen im Hintergrund weiter.", back);
  else back();
}
function finishCook(){ const id = cook.r.id; S.cooked[id] = cookCount(id) + 1; save(); timers = timers.filter(t => !t.key.startsWith(id + ":")); cook = {r: null, i: 0}; go("r-" + id); askRating(id); }
function askRating(id){
  const r = BY_ID[id], ov = document.createElement("div");
  ov.className = "rate-ov";
  ov.innerHTML = `<div class="rate-sh" role="dialog" aria-label="Bewerten"><h3>🎉 Guten Appetit!</h3><p>${esc(r.name)} · ${cookCount(id)}-mal gekocht. Wie war es heute?</p><div class="stars">${[1,2,3,4,5].map(i => `<button class="star" data-n="${i}" aria-label="${i} Sterne">☆</button>`).join("")}</div><button class="btn btn-g btn-full" data-skip style="margin-top:10px">Überspringen</button></div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); if (curR && curR.id === id) renderStars(); renderHome && document.getElementById("v-home").classList.contains("active") && renderHome(); };
  ov.querySelectorAll(".star").forEach(b => b.onclick = () => {
    const v = +b.dataset.n; (S.rateLog[id] = S.rateLog[id] || []).push(v); S.ratings[id] = v; save();

    setTimeout(() => { close(); toast("Danke! Ø ★ " + fmtAvg(avgRating(id).avg)); }, 350);
  });
  ov.querySelector("[data-skip]").onclick = close;
  ov.onclick = e => { if (e.target === ov) close(); };

document.getElementById("k-back").onclick = leaveCook;

/* ---------- Kühlschrank-Suche ---------- */
S.fridge = Object.assign({have: [], basis: null, upd: 0}, S.fridge || {});
let fTab = "p", fQ = "";
const FP = FR.products;
function basisList(){ return S.fridge.basis || FR.basisDef; }
function basisSet(){ return new Set([...basisList(), "wasser", "_skip", ...Object.keys(FP).filter(k => FP[k].g === "gewuerz")]); }
const LIGHT = new Set(FR.light);
function missW(list){ return list.reduce((a, k) => a + (LIGHT.has(k) ? .5 : 1), 0); }
function haveSet(){ const s = basisSet(); S.fridge.have.forEach(k => s.add(k)); return s; }
function pl(k){ return FP[k] ? FP[k].l : k; }
function fridgeChanged(){ S.fridge.upd = Date.now(); save(); cloudPush(); }

function matchRecipe(r, have){
  const H = FR.haupt[r.id];
  if (!H || r.cat === "Grundlagen" || !r.ing.length) return null;
  const sel = new Set(S.fridge.have);
  const prods = {};
  r.ing.forEach(i => { if (i.p && i.p !== "_skip" && i.p !== "gewuerz") (prods[i.p] = prods[i.p] || []).push(i); });
  const findSub = k => (FR.subs[k] || []).find(s => have.has(s[0]) && (!s[3] || s[3].includes(r.id)));
  const swaps = [], missing = [];
  let veg = false, hauptSel = false;
  for (const k of H) {
    if (have.has(k)) { if (sel.has(k)) hauptSel = true; continue; }
    const s = findSub(k);
    if (!s) return null;
    swaps.push({from: k, to: s[0], note: s[1], haupt: true});
    if (sel.has(s[0])) hauptSel = true;
    if (s[2]) veg = true;
  }
  if (!hauptSel) return null;
  for (const k in prods) {
    if (H.includes(k) || have.has(k)) continue;
    if (prods[k].every(i => /optional/i.test(i.n))) continue;
    if (veg && (k === "fischsauce" || k === "austernsauce")) {
      if (have.has("sojasauce")) swaps.push({from: k, to: "sojasauce", note: "Für vegetarisch: Sojasauce statt " + pl(k) + ".", haupt: false});
      else if (!missing.includes("sojasauce")) missing.push("sojasauce");
      continue;
    }
    const s = findSub(k);
    if (s) { swaps.push({from: k, to: s[0], note: s[1], haupt: false}); continue; }
    missing.push(k);
  }
  if (veg) {
    ["fischsauce", "austernsauce"].forEach(k => {
      if (prods[k] && have.has(k) && !swaps.some(x => x.from === k)) swaps.push({from: k, to: "sojasauce", note: "Für vegetarisch: Sojasauce statt " + pl(k) + ".", haupt: false});
    });
    if (prods.bruehe && r.ing.some(i => i.p === "bruehe" && /hühner|fleisch|rinder/i.test(i.n)))
      swaps.push({from: "bruehe", to: "bruehe", note: "Für vegetarisch: Gemüsebrühe statt Hühner- oder Fleischbrühe.", haupt: false});
  }
  const hauptSwap = swaps.some(x => x.haupt), w = missW(missing);
  let tier;
  if (!hauptSwap && w <= 1) tier = 1;
  else if (hauptSwap && w <= 3.5) tier = 2;
  else if (!hauptSwap && w <= 3.5) tier = 3;
  else return null;
  const own = Object.keys(prods).filter(k => !basisSet().has(k));
  const hit = own.filter(k => sel.has(k)).length;
  return {tier, swaps, missing, veg, score: own.length ? hit / own.length : 0};
}
function fridgeResults(){
  if (!S.fridge.have.length) return [];
  const have = haveSet();
  return RECIPES.map(r => ({r, m: matchRecipe(r, have)})).filter(x => x.m)
    .sort((a, b) => a.m.tier - b.m.tier || a.m.missing.length - b.m.missing.length || b.m.score - a.m.score);
}

function renderFridge(){
  const res = fridgeResults();
  document.getElementById("ft-pc").textContent = S.fridge.have.length;
  document.getElementById("ft-rc").textContent = res.length;
  document.getElementById("ft-p").classList.toggle("on", fTab === "p");
  document.getElementById("ft-r").classList.toggle("on", fTab === "r");
  document.getElementById("f-prod").hidden = fTab !== "p";
  document.getElementById("f-res").hidden = fTab !== "r";
  if (fTab === "p") renderFridgeProducts(); else renderFridgeResults(res);
}
function chipHtml(k, cls){ return `<button class="fchip ${cls}" data-fk="${k}">${cls.includes("on") ? "✓ " : ""}${esc(pl(k))}</button>`; }
function renderFridgeProducts(){
  const bs = new Set(basisList()), sel = new Set(S.fridge.have), q = fQ.toLowerCase();
  let h = "";
  if (S.fridge.have.length) {
    h += `<div class="sec-t">Ausgewählt (${S.fridge.have.length})</div><div class="fchips">` +
      S.fridge.have.map(k => chipHtml(k, "on")).join("") + `</div><div style="padding:10px 16px 0"><button class="btn btn-g btn-full" id="f-clear">Alles abwählen</button></div>`;
  }
  FR.groups.forEach(([g, label]) => {
    if (g === "gewuerz") return;
    const ks = Object.keys(FP).filter(k => FP[k].g === g && k !== "wasser" && !sel.has(k) && (!q || pl(k).toLowerCase().includes(q)));
    if (!ks.length) return;
    h += `<div class="sec-t">${esc(label)}</div><div class="fchips">` +
      ks.map(k => bs.has(k) ? `<button class="fchip base" data-base="${k}">🏠 ${esc(pl(k))}</button>` : chipHtml(k, "")).join("") + `</div>`;
  });
  if (q && !h.includes("data-fk") && !h.includes("data-base")) h += `<div class="empty">Kein Produkt gefunden.</div>`;
  h += `<details class="card fbasis" id="f-basis" ${S._basisOpen ? "open" : ""}><summary>🏠 Immer im Haus <small>(${basisList().length})</small></summary>
    <div class="card-b"><p class="hint" style="text-align:left;padding:4px 0 10px">Diese Produkte zählen immer als vorhanden. Gewürze wie Paprikapulver, Kreuzkümmel oder Lorbeer blockieren nie ein Rezept.</p>
    <div class="fchips" style="padding:0">${FR.basisCand.map(k => `<button class="fchip ${bs.has(k) ? "on" : ""}" data-bk="${k}">${bs.has(k) ? "🏠 " : ""}${esc(pl(k))}</button>`).join("")}</div>
    <button class="btn btn-g btn-full" style="margin-top:12px" id="f-basis-reset">Zurück auf Standard</button></div></details>`;
  const el = document.getElementById("f-prod-list");
  el.innerHTML = h;
  el.querySelectorAll("[data-fk]").forEach(b => b.onclick = () => {
    const k = b.dataset.fk, i = S.fridge.have.indexOf(k);
    if (i >= 0) S.fridge.have.splice(i, 1); else S.fridge.have.push(k);
    fridgeChanged(); const y = window.scrollY; renderFridge(); window.scrollTo(0, y);
  });
  el.querySelectorAll("[data-base]").forEach(b => b.onclick = () => toast("🏠 Immer im Haus. Ändern ganz unten."));
  el.querySelectorAll("[data-bk]").forEach(b => b.onclick = () => {
    const k = b.dataset.bk, list = basisList().slice(), i = list.indexOf(k);
    if (i >= 0) list.splice(i, 1); else list.push(k);
    S.fridge.basis = list; S._basisOpen = true; fridgeChanged(); const y = window.scrollY; renderFridge(); window.scrollTo(0, y);
  });
  const det = document.getElementById("f-basis"); det.ontoggle = () => { S._basisOpen = det.open; };
  const rs = document.getElementById("f-basis-reset"); rs.onclick = () => { S.fridge.basis = null; fridgeChanged(); renderFridge(); };
  const cl = document.getElementById("f-clear"); if (cl) cl.onclick = () => ask("Alle ausgewählten Produkte abwählen?", () => { S.fridge.have = []; fridgeChanged(); renderFridge(); });
}
function swapTxt(s){ return s.from === s.to ? s.note : pl(s.from) + " → " + pl(s.to); }
function renderFridgeResults(res){
  const el = document.getElementById("f-res");
  if (!S.fridge.have.length) { el.innerHTML = `<div class="empty">Wähle unter „Produkte“ aus, was du da hast.<br>Die passenden Rezepte erscheinen hier.</div>`; return; }
  if (!res.length) { el.innerHTML = `<div class="empty">Noch kein Rezept passt.<br>Wähle weitere Produkte aus, vor allem Fleisch, Gemüse oder Nudeln.</div>`; return; }
  const T = {1: ["✅ Kannst du jetzt kochen", ""], 2: ["🔄 Mit Tausch", "Eine Hauptzutat wird ersetzt."], 3: ["🛒 Fast", "Alle Hauptzutaten da, es fehlen noch ein paar Zutaten."]};
  let h = "", last = 0;
  res.forEach(({r, m}) => {
    if (m.tier !== last) { last = m.tier; h += `<div class="sec-t">${T[m.tier][0]} (${res.filter(x => x.m.tier === m.tier).length})</div>${T[m.tier][1] ? `<div class="hint" style="text-align:left;padding:0 18px 8px">${T[m.tier][1]}</div>` : ""}`; }
    const sw = m.swaps.filter(s => s.from !== s.to);
    const lines = [];
    if (sw.length) lines.push(`<div class="fsw">🔄 ${sw.map(s => esc(swapTxt(s))).join(" · ")}${m.veg ? ` <span class="vtag">vegetarisch</span>` : ""}</div>`);
    if (m.missing.length) lines.push(`<div class="fmiss">Fehlt: ${m.missing.map(k => esc(pl(k))).join(", ")}</div>`);
    h += `<div class="r-row fres" data-go="r-${r.id}">${pic(r)}<div class="m"><div class="n">${esc(r.name)}</div>${lines.join("")}</div><div class="chev">›</div></div>`;
    if (m.missing.length) h += `<button class="btn btn-s fshop" data-ms="${r.id}">🛒 Fehlendes auf die Einkaufsliste</button>`;
  });
  el.innerHTML = h;
  el.querySelectorAll("[data-ms]").forEach(b => b.onclick = e => { e.stopPropagation(); addMissingShop(BY_ID[b.dataset.ms]); });
}
function addMissingShop(r){
  const m = matchRecipe(r, haveSet()); if (!m || !m.missing.length) return;
  const f = factor(r); let n = 0;
  r.ing.filter(i => m.missing.includes(i.p)).forEach(i => {
    const ex = S.shop.find(s => s.name === i.n && s.u === i.u && !s.done);
    if (ex) { ex.a += i.a * f; if (!ex.from.includes(r.name)) ex.from.push(r.name); }
    else S.shop.push({id: Date.now() + Math.random(), name: i.n, a: i.a * f, u: i.u, from: [r.name], done: false});
    n++;
  });
  save(); updateShopStatus(); toast("🛒 " + n + (n === 1 ? " Zutat" : " Zutaten") + " auf der Einkaufsliste");
}
/* Hinweis-Karte im Rezept und Kochmodus, wenn man aus dem Kühlschrank kommt */
function fridgeBanner(r){
  if (lastList !== "kuehlschrank") return "";
  const m = matchRecipe(r, haveSet()); if (!m) return "";
  let h = `<div class="card fbanner"><div class="card-h"><span>🧊 Mit deinem Vorrat</span>${m.veg ? `<span class="vtag">vegetarisch</span>` : ""}</div><div class="card-b">`;
  if (!m.swaps.length && !m.missing.length) h += `<div class="note">✅ Alles da. Los geht's!</div>`;
  m.swaps.forEach(s => h += `<div class="note">🔄 <b>${esc(swapTxt(s))}</b>${s.from !== s.to ? "<br>" + esc(s.note) : ""}</div>`);
  if (m.missing.length) h += `<div class="note">🛒 <b>Fehlt:</b> ${m.missing.map(k => esc(pl(k))).join(", ")}</div><button class="btn btn-s btn-full" style="margin-top:10px" onclick="addMissingShop(curR||cook.r)">🛒 Fehlendes auf die Einkaufsliste</button>`;
  return h + `</div></div>`;
}
function ingMark(r, i){
  if (lastList !== "kuehlschrank" || !i.p) return "";
  const m = matchRecipe(r, haveSet()); if (!m) return "";
  const s = m.swaps.find(x => x.from === i.p && x.from !== x.to);
  if (s) return `<small class="fsw">🔄 ${esc(pl(s.to))}</small>`;
  if (m.missing.includes(i.p)) return `<small class="fmiss">fehlt</small>`;
  return "";
}

/* ---------- Cloud-Speicher (nur in Claude) ---------- */
const cloud = {ref: null, busy: false, again: false, timer: null};
function setSync(t){ const el = document.getElementById("f-sync"); if (el) el.textContent = t; }
function cloudPush(){
  if (!cloud.ref) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(async () => {
    if (cloud.busy) { cloud.again = true; return; }
    cloud.busy = true; setSync("☁️ speichert …");
    try { await cloud.ref.set({have: S.fridge.have.slice(), basis: S.fridge.basis, upd: S.fridge.upd}); setSync("☁️ gespeichert"); }
    catch (e) { setSync(e && e.code === "revoked" ? "📱 nur auf diesem Gerät" : "⚠️ nicht gespeichert"); if (e && (e.code === "revoked" || e.code === "invalid_argument")) cloud.ref = null; }
    cloud.busy = false;
    if (cloud.again) { cloud.again = false; cloudPush(); }
  }, 800);
}
async function initCloud(){
  setSync("📱 nur auf diesem Gerät");
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    cloud.ref = db.doc("data/users/" + uid + "/kuehlschrank");
    setSync("☁️ verbinde …");
    const to = setTimeout(() => setSync("☁️ gerade nicht erreichbar"), 10000);
    const apply = d => {
      S.fridge = {have: Array.isArray(d.have) ? d.have.filter(k => FP[k]) : [], basis: Array.isArray(d.basis) ? d.basis.filter(k => FP[k]) : null, upd: d.upd};
      save();
      if (document.getElementById("v-kuehl").classList.contains("active")) renderFridge();
      if (document.getElementById("v-home").classList.contains("active")) renderHome();
    };
    const first = await cloud.ref.get();
    clearTimeout(to);
    const d0 = first.exists ? first.data() : null;
    if (d0 && (d0.upd || 0) > (S.fridge.upd || 0)) apply(d0);
    else if (S.fridge.upd && (!d0 || (d0.upd || 0) < S.fridge.upd)) cloudPush();
    setSync("☁️ gespeichert");
    cloud.ref.onSnapshot(snap => {
      if (snap.metadata && (snap.metadata.fromCache || snap.metadata.hasPendingWrites)) return;
      const d = snap.exists ? snap.data() : null;
      if (d && (d.upd || 0) > (S.fridge.upd || 0)) apply(d);
    }, e => { if (e && e.code === "revoked") { setSync("📱 nur auf diesem Gerät"); cloud.ref = null; } });
  } catch (e) { setSync("📱 nur auf diesem Gerät"); }
}
initCloud();

route();
phInit();

  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
